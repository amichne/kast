name: Isolated runtime candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact numeric version for the candidates
        required: true
        default: 0.0.0
        type: string
      action_revision:
        description: Retired archive-action input; must be empty
        required: false
        type: string
      linux_only:
        description: Assemble and qualify only Linux x86-64
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: inputs.action_revision != 'check-release-visibility'
    name: Replay sealed Linux release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      matrix:
        target: [linux-x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-sealed-cffa7e95ebb0270b1cbc116c7ac1ec3ecad554cd-2
          run-id: 44103018417
          github-token: ${{ github.token }}
          path: build/product-candidate
      - name: Require an explicit component-qualified baseline
        env:
          BASELINE_RUN_ID: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ID }}
          BASELINE_RUN_ATTEMPT: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ATTEMPT }}
          BASELINE_REVISION: ${{ vars.KAST_ACCEPTANCE_BASELINE_REVISION }}
          BASELINE_RECORD_SHA256: ${{ vars.KAST_ACCEPTANCE_BASELINE_RECORD_SHA256 }}
        run: |
          test -n "$BASELINE_RUN_ID" && test -n "$BASELINE_RUN_ATTEMPT" && test -n "$BASELINE_REVISION" && test -n "$BASELINE_RECORD_SHA256" || {
            echo 'Unmet input: explicit different component-qualified baseline required; repair is not upgrade' >&2
            exit 1
          }
      # Schema-2 baselines qualify only with their detached acceptance receipts, which
      # exist in the joined candidate. Legacy baselines predate that artifact; admission
      # below still rejects a schema-2 sealed record that lacks acceptance.
      - name: Download the accepted baseline candidate
        id: accepted-baseline
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-candidate-${{ vars.KAST_ACCEPTANCE_BASELINE_REVISION }}-${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ATTEMPT }}
          run-id: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ID }}
          github-token: ${{ github.token }}
          path: build/product-baseline
      - name: Download the legacy sealed baseline
        if: steps.accepted-baseline.outcome != 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-sealed-${{ vars.KAST_ACCEPTANCE_BASELINE_REVISION }}-${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ATTEMPT }}
          run-id: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ID }}
          github-token: ${{ github.token }}
          path: build/product-baseline
      - name: Admit exact sealed baseline provenance and pinned interpreter inputs
        env:
          BASELINE_RUN_ID: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ID }}
          BASELINE_RUN_ATTEMPT: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ATTEMPT }}
          BASELINE_REVISION: ${{ vars.KAST_ACCEPTANCE_BASELINE_REVISION }}
          BASELINE_RECORD_SHA256: ${{ vars.KAST_ACCEPTANCE_BASELINE_RECORD_SHA256 }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          PYTHONPATH=.github/scripts/release:packaging/internal/bootstrap:packaging python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          import product_candidate
          from private_interpreter import PINS, DEPENDENCY_URL, PrivateInterpreter
          producer = product_candidate.product.ProductProducer(int(os.environ['BASELINE_RUN_ID']), int(os.environ['BASELINE_RUN_ATTEMPT']), '.github/workflows/ci.yml')
          route = f'repos/amichne/kast/actions/runs/{producer.runId}/attempts/{producer.runAttempt}/jobs?per_page=100'
          jobs = product_candidate.product.document(subprocess.run(['gh', 'api', route], check=True, capture_output=True, timeout=30).stdout)
          baseline = product_candidate.admit_baseline(Path('build/product-baseline'), os.environ['BASELINE_RECORD_SHA256'], os.environ['BASELINE_REVISION'], producer, product_candidate.observe(producer), jobs)
          source = product_candidate.product.HttpReleaseSource()
          if isinstance(baseline, product_candidate.candidate.Failure):
              raise SystemExit(f'Unmet baseline input: {baseline.value}')
          pin = next(item for item in PINS if item.target == os.environ['TARGET'])
          for url, name, limit in ((pin.url, 'private-python.tar.gz', 268435456), (DEPENDENCY_URL, 'defusedxml.whl', 1048576)):
              result = source.download(url, Path('build') / name, limit)
              if isinstance(result, product_candidate.product.TransferFailure):
                  raise SystemExit(result.value)
          PrivateInterpreter.admit(Path('build/private-python.tar.gz'), Path('build/defusedxml.whl'), pin.target)
          PY
      - name: Start the Linux user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user start default.target
      - name: Exercise installed CLI MCP RPC and lifecycle against retained bytes
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          mise exec -- uv run --locked --project packaging python packaging/internal/verification/product_lifecycle_probe.py
          --candidate build/product-candidate --baseline build/product-baseline
          --target "$TARGET" --private-python-archive build/private-python.tar.gz
          --private-dependency build/defusedxml.whl --evidence build/installed-evidence
          --receipt "build/acceptance-${TARGET}.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: replay-acceptance-receipt
          path: build/acceptance-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Capture ownership facts after a rejected uninstall
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json
          import os
          import stat

          evidence = Path('build/installed-evidence')
          marker = evidence / 'disposable-root.txt'
          if not marker.is_file():
              raise SystemExit(0)
          recorded = Path(marker.read_text().strip())
          work = next((p for p in (recorded, *recorded.parents) if p.name.startswith('kast-installed-native-') and p.parent == Path('/tmp')), None)
          if work is None or work.resolve() != work or not work.is_dir() or work.stat().st_uid != os.getuid():
              raise SystemExit('disposable-root identity unavailable')
          home = work / 'home'
          containers = home / '.local/share/kast-workspaces/containers'
          output = []
          def record(path, role, depth=0):
              if depth > 4 or len(output) >= 256:
                  return
              if not os.path.lexists(path):
                  output.append(f'{role} absent')
                  return
              info = path.lstat()
              mode = info.st_mode
              output.append(f'{role} kind={stat.S_IFMT(mode):o} mode={stat.S_IMODE(mode):o} same_uid={info.st_uid == os.getuid()} exact_path={path.resolve() == path}')
              if stat.S_ISDIR(mode) and depth < 4 and info.st_uid == os.getuid() and path.resolve() == path:
                  for child in sorted(path.iterdir(), key=lambda item: item.name)[:32]:
                      name = child.name
                      if name not in {'ide-hosted', 'ide-lifecycle', 'state', 'approval', 'workspaces', 'owner.lock', 'endpoint.json', 'host.sock', 'mutation.sqlite', 'topology.sqlite'}:
                          name = hashlib.sha256(name.encode()).hexdigest()[:16]
                      record(child, f'{role}/{name}', depth + 1)
              if path.name == 'endpoint.json' and stat.S_ISREG(mode) and info.st_size <= 65536 and info.st_uid == os.getuid():
                  try:
                      data = json.loads(path.read_bytes())
                      output.append(f'{role} protocol={data.get("protocol") if isinstance(data.get("protocol"), int) else "invalid"} socket_matches={data.get("socket") == str(path.with_name("host.sock"))} schema_present={isinstance(data.get("querySchema"), str)}')
                  except (ValueError, OSError):
                      output.append(f'{role} invalid_descriptor')
          for i, container in enumerate(sorted(containers.glob('*'))[:8]):
              profiles = [container, *sorted((container / 'generations').glob('*'))[:8]]
              for j, profile in enumerate(profiles):
                  if profile.resolve() != profile:
                      continue
                  profile_home = profile / 'state/home'
                  record(profile_home, f'profile-{i}-{j}-home', depth=4)
                  record(profile_home / '.kast', f'profile-{i}-{j}-state')
          (evidence / 'uninstall-ownership.txt').write_text('\n'.join(output) + '\n')
          PYTHON
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: kast-installed-evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/installed-evidence/
          if-no-files-found: warn
          retention-days: 14

  observe-release-visibility:
    if: inputs.action_revision == 'check-release-visibility'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Read draft visibility under the publication token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" | jq '{repository: .full_name, push_reported: (.permissions.push == true)}'
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -e '{draft_visible: any(.[][]; .draft == true)} | select(.draft_visible)'
