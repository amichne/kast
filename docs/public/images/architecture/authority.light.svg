<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312.2499999999999 449.4" width="312.2499999999999" height="449.4" style="--bg:#FBFBF9;--fg:#20231F;--line:#9CA59A;--accent:#3154C7;--muted:#52594E;--surface:#F2F3EE;--border:#B9C1B4;background:var(--bg)">
<style>

  text { font-family: 'SUSE', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="authority-arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="authority-arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="T" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="156.12499999999994,60.900000000000006 156.12499999999994,96.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#authority-arrowhead)" />
<polyline class="edge" data-from="T" data-to="H" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="156.12499999999994,133.8 156.12499999999994,169.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#authority-arrowhead)" />
<polyline class="edge" data-from="H" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="156.12499999999994,206.70000000000002 156.12499999999994,242.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#authority-arrowhead)" />
<polyline class="edge" data-from="D" data-to="Q" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="156.12499999999994,279.6 156.12499999999994,315.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#authority-arrowhead)" />
<polyline class="edge" data-from="Q" data-to="O" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="156.12499999999994,352.5 156.12499999999994,388.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#authority-arrowhead)" />
<g class="node" data-id="A" data-label="Agent chooses the question" data-shape="rectangle">
  <rect x="54.751499999999965" y="24" width="202.74699999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="156.12499999999994" y="42.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Agent chooses the question</text>
</g>
<g class="node" data-id="T" data-label="Transport carries the request" data-shape="rectangle">
  <rect x="47.341499999999954" y="96.9" width="217.56699999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="156.12499999999994" y="115.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Transport carries the request</text>
</g>
<g class="node" data-id="H" data-label="IDEA admits the exact workspace" data-shape="rectangle">
  <rect x="38.819999999999936" y="169.8" width="234.61" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="156.12499999999994" y="188.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">IDEA admits the exact workspace</text>
</g>
<g class="node" data-id="D" data-label="Domains establish compiler facts" data-shape="rectangle">
  <rect x="40.67249999999997" y="242.70000000000002" width="230.90499999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="156.12499999999994" y="261.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Domains establish compiler facts</text>
</g>
<g class="node" data-id="Q" data-label="Query preserves completion and limits" data-shape="rectangle">
  <rect x="24" y="315.6" width="264.2499999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="156.12499999999994" y="334.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Query preserves completion and limits</text>
</g>
<g class="node" data-id="O" data-label="Agent receives scoped evidence" data-shape="rectangle">
  <rect x="38.44949999999997" y="388.5" width="235.35099999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="156.12499999999994" y="406.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Agent receives scoped evidence</text>
</g>
</svg>
