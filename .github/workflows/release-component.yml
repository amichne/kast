name: Release component

on:
  workflow_dispatch:
    inputs:
      component:
        description: Service to build and publish independently
        required: true
        type: choice
        options: [control, host]
      bump:
        description: Selected service semantic version component to increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-component-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish selected service
    if: github.ref == 'refs/heads/main' && vars.KAST_MACOS_CHECKS == 'true' && vars.KAST_NATIVE_COMPILATION != 'false'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMPONENT: ${{ inputs.component }}
      RELEASE_BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: uv

      - name: Admit exact current main source
        run: mise run release:main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: ./.github/actions/jq-oracle
      - name: Resolve selected service version
        id: release_version
        run: mise run release:version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'
      - name: Set up the frontend Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # IDEA library transform outputs already belong to caches.
          gradle-home-cache-includes: |
            caches
            notifications
      - name: Check selected service and assemble its release
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: mise run release:build-component
      - name: Admit selected component release
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: mise run release:admit-component
      - name: Retain selected component candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.component }}-release-candidate-v${{ steps.release_version.outputs.version }}-${{ github.sha }}
          path: build/release/${{ inputs.component }}-v${{ steps.release_version.outputs.version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish selected component
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: mise run release:publish-component
      - name: Retain build reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: component-reports-${{ inputs.component }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14
