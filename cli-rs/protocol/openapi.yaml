      tags:
        - read
      x-jsonrpc-method: raw/implementations
      x-kast-required-capability: IMPLEMENTATIONS
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ImplementationsQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ImplementationsResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/code-actions":
    post:
      operationId: codeActions
      summary: Return available code actions at a file position
      tags:
        - read
      x-jsonrpc-method: raw/code-actions
      x-kast-required-capability: CODE_ACTIONS
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CodeActionsQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CodeActionsResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/completions":
    post:
      operationId: completions
      summary: Return completion candidates available at a file position
      tags:
        - read
      x-jsonrpc-method: raw/completions
      x-kast-required-capability: COMPLETIONS
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CompletionsQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CompletionsResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/rename":
    post:
      operationId: rename
      summary: Plan a symbol rename (dry-run by default)
      tags:
        - mutation
      x-jsonrpc-method: raw/rename
      x-kast-required-capability: RENAME
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RenameQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RenameResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/plan-replacement":
    post:
      operationId: planReplacement
      summary: Plan an identity-preserving function or property replacement
      tags:
        - mutation
      x-jsonrpc-method: raw/plan-replacement
      x-kast-required-capability: PLAN_REPLACEMENT
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ReplacementPlanQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReplacementPlanResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/plan-add-file":
    post:
      operationId: planAddFile
      summary: Plan a compiler-proven Kotlin source file addition
      tags:
        - mutation
      x-jsonrpc-method: raw/plan-add-file
      x-kast-required-capability: PLAN_ADD_FILE
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AddFilePlanQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AddFilePlanResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/verify-mutation-postcondition":
    post:
      operationId: verifyMutationPostcondition
      summary: Verify one exact mutation postcondition
      tags:
        - mutation
      x-jsonrpc-method: raw/verify-mutation-postcondition
      x-kast-required-capability: VERIFY_MUTATION_POSTCONDITION
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MutationPostconditionQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MutationPostconditionResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/exact-file-observation":
    post:
      operationId: exactFileObservation
      summary: Observe one file as an exact byte image or proven absence
      tags:
        - mutation
      x-jsonrpc-method: raw/exact-file-observation
      x-kast-required-capability: EXACT_FILE_OBSERVATION
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RawExactFileObservationQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RawExactFileObservationResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/exact-file-image-cas":
    post:
      operationId: exactFileImageCas
      summary: Commit one exact file byte image with compare-and-swap
      tags:
        - mutation
      x-jsonrpc-method: raw/exact-file-image-cas
      x-kast-required-capability: EXACT_FILE_IMAGE_CAS
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ExactFileImageQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ExactFileImageResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/inspect-mutation-scratch":
    post:
      operationId: inspectMutationScratch
      summary: Fence a mutation attempt and inspect its exact scratch namespace
      tags:
        - mutation
      x-jsonrpc-method: raw/inspect-mutation-scratch
      x-kast-required-capability: MUTATION_SCRATCH_RECOVERY
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MutationScratchInspectQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MutationScratchInspectResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/recover-mutation-scratch":
    post:
      operationId: recoverMutationScratch
      summary: Restore or finalize one journal-owned mutation scratch set
      tags:
        - mutation
      x-jsonrpc-method: raw/recover-mutation-scratch
      x-kast-required-capability: MUTATION_SCRATCH_RECOVERY
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MutationScratchRecoveryQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MutationScratchRecoveryResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/optimize-imports":
    post:
      operationId: optimizeImports
      summary: Optimize imports for one or more files
      tags:
        - mutation
      x-jsonrpc-method: raw/optimize-imports
      x-kast-required-capability: OPTIMIZE_IMPORTS
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ImportOptimizeQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ImportOptimizeResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/apply-edits":
    post:
      operationId: applyEdits
      summary: Apply a prepared edit plan with file-hash conflict detection
      tags:
        - mutation
      x-jsonrpc-method: raw/apply-edits
      x-kast-required-capability: APPLY_EDITS
      x-kast-conditional-capability: FILE_OPERATIONS — required when fileOperations is non-empty
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ApplyEditsQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApplyEditsResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/workspace-refresh":
    post:
      operationId: refreshWorkspace
      summary: Force a targeted or full workspace state refresh
      tags:
        - mutation
      x-jsonrpc-method: raw/workspace-refresh
      x-kast-required-capability: REFRESH_WORKSPACE
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RefreshQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RefreshResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
components:
  schemas:
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        method:
          type: string
        params:
          description: Method-specific parameter object
        id:
          description: Request identifier (string, number, or null)
      additionalProperties: false
    JsonRpcSuccessResponse:
      type: object
      required:
        - jsonrpc
        - result
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        result:
          description: Method-specific result object
        id:
          description: Echoed request identifier
      additionalProperties: false
    JsonRpcErrorResponse:
      type: object
      required:
        - jsonrpc
        - error
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        error:
          $ref: "#/components/schemas/JsonRpcErrorObject"
        id:
          description: Echoed request identifier
      additionalProperties: false
    JsonRpcErrorObject:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          anyOf:
            - "$ref": "#/components/schemas/ApiErrorResponse"
            - type: "null"
      additionalProperties: false
      required:
        - code
        - message
    ApiErrorResponse:
      type: object
      properties:
        schemaVersion:
          type: integer
          format: int32
        requestId:
          type: string
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
      required:
        - requestId
        - code
        - message
        - retryable
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        backendName:
          type: string
        backendVersion:
          type: string
        workspaceRoot:
          type: string
        schemaVersion:
          type: integer
          format: int32
      additionalProperties: false
      required:
        - backendName
        - backendVersion
        - workspaceRoot
    RuntimeStatusResponse:
      type: object
      properties:
        state:
          "$ref": "#/components/schemas/RuntimeState"
        backendName:
          type: string
        backendVersion:
          type: string
        workspaceRoot:
          type: string
        message:
          anyOf:
            - type: string
            - type: "null"
        warnings:
          type: array
          items:
            type: string
        sourceModuleNames:
          type: array
          items:
            type: string
        dependentModuleNamesBySourceModuleName:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        readiness:
          "$ref": "#/components/schemas/RuntimeReadiness"
        referenceCoverageState:
          "$ref": "#/components/schemas/ReferenceCoverageState"
        referenceCoverageLimitations:
          type: array
          items:
            "$ref": "#/components/schemas/ReferenceCoverageLimitation"
        publishedWorkspaceGeneration:
          anyOf:
            - "$ref": "#/components/schemas/PublishedWorkspaceGenerationStatus"
            - type: "null"
