[project]
name = "kast-managed-installation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "defusedxml==0.7.1",
    "types-defusedxml==0.7.0.20260504",
]

[dependency-groups]
dev = ["ruff==0.14.0", "pyright[nodejs]==1.1.407", "pytest==9.0.3"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "internal/product/local_product_install.py", "tests/test_local_product_install.py",
    "internal/verification/harness_launchd.py", "tests/test_harness_launchd.py",
    "internal/verification/local_product_probe.py", "internal/verification/product_acceptance.py",
    "internal/verification/product_lifecycle_probe.py", "tests/test_product_acceptance.py",
    "internal/installation/immutable_store.py",
    "internal/product/product_removal_recovery.py", "internal/product/product_state_removal.py",
    "internal/product/managed_product_removal.py", "internal/runtime/runtime_base.py",
    "internal/bootstrap/private_interpreter.py", "internal/bootstrap/bootstrap_entry.py",
    "internal/bootstrap/generate_bootstrap.py", "internal/bootstrap/bootstrap_release.py", "tests/test-managed-bootstrap.py",
    "internal/product/managed_product.py", "internal/product/managed_product_installation.py",
    "tests/test-managed-build-record.py", "tests/test_composition_platform.py",
    "internal/composition/composition_platform.py", "composed_bundle.py", "tests/test_composition_bundle.py",
    "internal/verification/composed_host_probe.py", "tests/test_composition_descriptors.py",
    "tests/test_composition_host.py", "internal/composition/composed_host.py",
    "internal/composition/composition_descriptors.py", "internal/composition/composition_recipe.py",
    "internal/composition/composition_index.py", "tests/test_composition_index.py",
    "internal/composition/composition_graph.py", "tests/test_composition_graph.py",
    "managed_headless.py", "tests/test-managed-headless.py", "internal/installation/managed_installation.py",
    "internal/installation/managed_release.py", "internal/installation/managed_update_journal.py",
    "internal/installation/managed_update_contract.py", "tests/test-managed-installation.py",
    "tests/test-managed-release.py",
    "internal/composition/composed_release.py", "tests/test_composition_release.py",
    "internal/composition/composed_ci.py", "tests/test_composition_ci.py",
    "internal/runtime/runtime_archive.py", "tests/test_runtime_archive.py",
]
extraPaths = ["internal/bootstrap", "internal/composition", "internal/configuration", "internal/installation", "internal/product", "internal/query", "internal/runtime", "internal/verification", ".", "tests", "../.github/scripts/release", "../.github/scripts/ci"]
reportUnusedCallResult = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "internal/bootstrap", "internal/composition", "internal/configuration", "internal/installation", "internal/product", "internal/query", "internal/runtime", "internal/verification", "tests"]
extend-include = ["**/local_product_install.py", "**/test_local_product_install.py", "**/harness_launchd.py", "**/test_harness_launchd.py","**/local_product_probe.py", "**/product_acceptance.py", "**/product_lifecycle_probe.py", "**/test_product_acceptance.py", "**/runtime_base.py", "**/managed_product_removal.py", "**/immutable_store.py", "**/product_removal_recovery.py", "**/product_state_removal.py"]
include = ["**/private_interpreter.py", "**/bootstrap_entry.py", "**/generate_bootstrap.py", "**/bootstrap_release.py", "**/test-managed-bootstrap.py", "**/managed_product.py", "**/managed_product_installation.py", "**/test-managed-build-record.py", "**/test_composition_platform.py", "**/composition_platform.py", "**/composed_bundle.py", "**/test_composition_bundle.py", "**/composed_host_probe.py", "**/test_composition_descriptors.py", "**/test_composition_host.py", "**/composed_host.py", "**/composition_descriptors.py", "**/composition_recipe.py", "**/composition_index.py", "**/test_composition_index.py", "**/composition_graph.py", "**/test_composition_graph.py", "**/managed_headless.py", "**/test-managed-headless.py", "**/managed_installation.py", "**/managed_release.py", "**/managed_update_journal.py", "**/managed_update_contract.py", "**/test-managed-installation.py", "**/test-managed-release.py", "**/composed_release.py", "**/test_composition_release.py", "**/composed_ci.py", "**/test_composition_ci.py", "**/runtime_archive.py", "**/test_runtime_archive.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.per-file-target-version]
"internal/installation/managed_update_journal.py" = "py39"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
pythonpath = ["internal/bootstrap", "internal/composition", "internal/configuration", "internal/installation", "internal/product", "internal/query", "internal/runtime", "internal/verification", ".", "tests"]
python_files = ["test-managed-*.py", "test_local_product_install.py", "test_harness_launchd.py", "test_composition_*.py", "test_runtime_archive.py", "test_product_acceptance.py"]
testpaths = ["."]
