name: OpenWiki Update

on:
  workflow_dispatch:

# Manual and any future daily trigger must share this group. Do not cancel a
# running producer: its native checkpoints are the durable recovery mechanism.
concurrency:
  group: openwiki-maintenance
  cancel-in-progress: false

# A daily trigger stays disabled until a separately authorized noninteractive
# authentication/model-access check succeeds. Credential presence is not proof.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install the pinned Python runner
        run: python3 -m pip install --disable-pip-version-check uv==0.12.9

      - name: Report secret-free credential readiness
        run: >-
          uv run --locked --project docs/internal/tooling python docs/internal/tooling/knowledge_refresh.py
          --repo "$GITHUB_WORKSPACE" --state-dir "$RUNNER_TEMP/kast-knowledge"
          --host native --readiness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run isolated maintenance for the frozen source
        id: maintenance
        continue-on-error: true
        run: >-
          uv run --locked --project docs/internal/tooling python docs/internal/tooling/knowledge_refresh.py
          --repo "$GITHUB_WORKSPACE" --state-dir "$RUNNER_TEMP/kast-knowledge"
          --source-revision "$GITHUB_SHA" --host native --bootstrap --run
          > "$RUNNER_TEMP/knowledge-refresh.json"
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: "gpt-6-luna"
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"

      - name: Read bounded maintenance result
        id: result
        if: ${{ !cancelled() && steps.maintenance.outcome != 'skipped' }}
        run: |
          python3 - "$RUNNER_TEMP/knowledge-refresh.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          with Path(sys.argv[2]).open("a") as output:
              for name in ("outcome", "worktree"):
                  value = result.get(name) or ""
                  if not isinstance(value, str) or "\n" in value or "\r" in value:
                      raise ValueError("Invalid maintenance result")
                  output.write(name + "=" + value + "\n")
          PY

      - name: Keep reviewable native progress and outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiki-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/knowledge-refresh.json
            ${{ runner.temp }}/kast-knowledge/*/result.json
            ${{ runner.temp }}/kast-knowledge/*/worktree/openwiki/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Create a completely qualified update pull request
        if: ${{ !cancelled() && steps.result.outputs.outcome == 'integration_eligible' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: ${{ steps.result.outputs.worktree }}
          add-paths: |
            openwiki
            docs/public
            docs/okf-public.json
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Native completion and full documentation qualification passed for
            the frozen candidate. Reassess the exact candidate before integration.
            This pull request does not authorize publication or deployment.

      - name: Propagate incomplete or failed maintenance
        if: ${{ steps.maintenance.outcome == 'failure' }}
        run: exit 1
