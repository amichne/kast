name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin product
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol test dependencies
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true
          # Keep the setup-gradle default: main writes; other branches restore only.
          gradle-home-cache-includes: |
            caches
            notifications
            kast/workspace-intellij-read-idea-distributions
            kast/symbol-intellij-idea-distributions
            kast/topology-intellij-kotlin-plugin

      - name: Resolve next patch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: candidate_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 distribution/release/resolve_version.py
          --repository "$GITHUB_REPOSITORY"
          --bump patch

      - name: Build and verify product
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git checkout --detach "$CANDIDATE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            python3 .github/scripts/ci/verify-checks.py --preflight-only
          else
            python3 .github/scripts/ci/verify-checks.py
          fi

      - name: Build exact patch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          RELEASE_VERSION: ${{ steps.candidate_version.outputs.version }}
        run: bash .github/scripts/ci/verify.sh --version "$RELEASE_VERSION"

      - name: Admit exact patch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: ${{ steps.candidate_version.outputs.version }}
        run: >-
          python3 .github/scripts/release/ci-candidate.py validate
          --repository "$GITHUB_REPOSITORY"
          --version "$RELEASE_VERSION"
          --source-revision "$GITHUB_SHA"
          --directory "build/release/v${RELEASE_VERSION}"

      - name: Retain exact patch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-release-candidate-v${{ steps.candidate_version.outputs.version }}-${{ github.sha }}
          path: build/release/v${{ steps.candidate_version.outputs.version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
