name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin product
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol test dependencies
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true
          # Keep the setup-gradle default: main writes; other branches restore only.
          gradle-home-cache-includes: |
            caches
            notifications
            kast/workspace-intellij-read-idea-distributions
            kast/symbol-intellij-idea-distributions
            kast/change-intellij-idea-distributions
            kast/topology-intellij-kotlin-plugin

      - name: Build and verify product
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git checkout --detach "$CANDIDATE_SHA"
          python3 .github/scripts/ci/verify-checks.py

      - name: Retain built distributions
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-distributions-${{ github.sha }}
          path: |
            build/distributions/kast-control-*.tar.gz
            runtime/hosted/build/distributions/kast-ide-hosted-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
