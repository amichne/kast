name: Publish Snapshot

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      snapshot-version:
        description: "Snapshot version, for example 0.8.0-SNAPSHOT"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: snapshot-${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      snapshot-version: ${{ steps.snapshot-version.outputs.value }}
      snapshot-tag: ${{ steps.snapshot-version.outputs.tag }}
      publish-snapshot: ${{ steps.snapshot-version.outputs.publish }}
      source-sha: ${{ steps.snapshot-version.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Test snapshot installer contract
        run: bash .github/scripts/install/test-snapshot-installer-contract.sh

      - name: Set up Java for manual snapshot validation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle for manual snapshot validation
        if: github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@v5

      - name: Resolve snapshot version
        id: snapshot-version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.snapshot-version }}"
          require_snapshot=false
          publish_snapshot=false
          source_sha="$GITHUB_SHA"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            require_snapshot=true
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            source_sha="${{ github.event.workflow_run.head_sha }}"
          fi

          if [[ -z "$version" ]]; then
            base="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)"
            version="${base#v}-SNAPSHOT"
          fi
          version="${version#v}"

          if [[ "$require_snapshot" == "true" && "$version" != *-SNAPSHOT ]]; then
            echo "ERROR: snapshot version must end with -SNAPSHOT" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            publish_snapshot=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && "$version" == *-SNAPSHOT ]]; then
            publish_snapshot=true
          fi

          if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
            echo "ERROR: snapshot workflow source ${source_sha} differs from workflow source ${GITHUB_SHA}" >&2
            exit 1
          fi

          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\n' "$publish_snapshot" >> "$GITHUB_OUTPUT"
          printf 'source-sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Download CI Maven publication ledger
        if: github.event_name == 'workflow_run' && steps.snapshot-version.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: ci-artifact-ledger-maven-publication
          path: ci-ledgers
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Run local publication checks for manual snapshot
        if: github.event_name == 'workflow_dispatch' && steps.snapshot-version.outputs.publish == 'true'
        run: >
          ./gradlew
          test
          :analysis-api:publishToMavenLocal
          :analysis-server:publishToMavenLocal
          :index-store:publishToMavenLocal
          -Pkast.publish.target=local
          -Pversion="${{ steps.snapshot-version.outputs.value }}"
          --no-daemon
          --stacktrace

      - name: Record manual snapshot publication ledger
        if: github.event_name == 'workflow_dispatch' && steps.snapshot-version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-ledgers
          printf 'gitSha=%s\nsourceRef=%s\nworkflowRunId=%s\n' \
            "$GITHUB_SHA" \
            "$GITHUB_REF" \
            "$GITHUB_RUN_ID" \
            > ci-ledgers/maven-publication-validation.txt
          scripts/verify-ci-artifact-ledger.py record \
            --output ci-ledgers/maven-publication.json \
            --git-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind ci-maven-publication-validation \
            --artifact-name ci-maven-publication-validation \
            --artifact-path ci-ledgers/maven-publication-validation.txt \
            --producer-job snapshot-validate \
            --build-command-id snapshot-manual-publish-to-local

      - name: Verify snapshot publication ledger
        if: steps.snapshot-version.outputs.publish == 'true'
        shell: bash
        run: >
          scripts/verify-ci-artifact-ledger.py verify
          --ledger ci-ledgers/maven-publication.json
          --git-sha "${{ steps.snapshot-version.outputs.source-sha }}"
          --require-kind ci-maven-publication-validation

      - name: Upload snapshot publication ledger
        if: steps.snapshot-version.outputs.publish == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-artifact-ledger-maven-publication
          path: ci-ledgers/maven-publication.json
          if-no-files-found: error
          retention-days: 3

  build-cli:
    name: Build snapshot CLI (${{ matrix.asset_id }})
    needs: validate
    if: needs.validate.outputs.publish-snapshot == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_id: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cache_key: source-bound-cli-release
          - asset_id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cache_key: release-cli-linux-arm64
          - asset_id: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cache_key: release-cli-macos-x64
          - asset_id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            cache_key: release-cli-macos-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
      - uses: ./.github/scripts/release/actions/build-cli
        with:
          asset_id: ${{ matrix.asset_id }}
          target: ${{ matrix.target }}
          cache_key: ${{ matrix.cache_key }}
          release_tag: snapshot
          release_version: ${{ needs.validate.outputs.snapshot-version }}

  build-indexer:
    name: Build snapshot indexer
    needs: validate
    if: needs.validate.outputs.publish-snapshot == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source-sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Free disk for indexer packaging
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Build retained snapshot indexer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf indexer/build/portable-dist indexer/build/distributions
          ./scripts/ci-gradle-retry.sh ./gradlew \
            -Pversion="${{ needs.validate.outputs.snapshot-version }}" \
            :indexer:syncRuntimeLibs \
            :indexer:syncPortableDist \
            :indexer:verifyPortableDistLayout \
            :indexer:portableDistZip \
            --no-daemon
          mapfile -t indexer_zips < <(find indexer/build/distributions -maxdepth 1 -type f -name 'indexer-*-portable.zip' -print)
          [[ "${#indexer_zips[@]}" -eq 1 ]] \
            || { echo "Expected one portable indexer zip, found ${#indexer_zips[@]}" >&2; exit 1; }
          mkdir -p dist
          cp "${indexer_zips[0]}" dist/indexer.zip
          scripts/verify-ci-artifact-ledger.py record \
            --output dist/build-ledger-indexer.json \
            --git-sha "${{ needs.validate.outputs.source-sha }}" \
            --source-ref refs/tags/snapshot \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind release-indexer \
            --artifact-name indexer.zip \
            --artifact-path dist/indexer.zip \
            --producer-job build-indexer \
            --build-command-id snapshot-indexer-build

      - name: Retain snapshot indexer
        uses: actions/upload-artifact@v6
        with:
          name: indexer-${{ github.run_id }}
          path: |
            dist/indexer.zip
            dist/build-ledger-indexer.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build-setup-bundles:
    name: Build snapshot setup bundle (${{ matrix.platform }})
    needs:
      - validate
      - build-cli
      - build-indexer
    if: >-
      always() &&
      needs.validate.outputs.publish-snapshot == 'true' &&
      needs.build-cli.result == 'success' &&
      needs.build-indexer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
      - uses: ./.github/scripts/release/actions/build-setup-bundle
        with:
          platform: ${{ matrix.platform }}
          tag: snapshot
          version: ${{ needs.validate.outputs.snapshot-tag }}

  publish-github-packages:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.publish-snapshot == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source-sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Download snapshot publication ledger
        uses: actions/download-artifact@v7
        with:
          name: snapshot-artifact-ledger-maven-publication
          path: ci-ledgers

      - name: Verify snapshot publication ledger
        shell: bash
        run: >
          scripts/verify-ci-artifact-ledger.py verify
          --ledger ci-ledgers/maven-publication.json
          --git-sha "${{ needs.validate.outputs.source-sha }}"
          --require-kind ci-maven-publication-validation

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew publishAllPublicationsToGitHubPackagesRepository \
            -Pkast.publish.target=github \
            -Pversion="${{ needs.validate.outputs.snapshot-version }}" \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

  publish-maven-central:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.publish-snapshot == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source-sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Download snapshot publication ledger
        uses: actions/download-artifact@v7
        with:
          name: snapshot-artifact-ledger-maven-publication
          path: ci-ledgers

      - name: Verify snapshot publication ledger
        shell: bash
        run: >
          scripts/verify-ci-artifact-ledger.py verify
          --ledger ci-ledgers/maven-publication.json
          --git-sha "${{ needs.validate.outputs.source-sha }}"
          --require-kind ci-maven-publication-validation

      - name: Check Maven Central and signing secrets
        id: gate
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          SIGNING_GPG_PRIVATE_KEY: ${{ secrets.SIGNING_GPG_PRIVATE_KEY }}
          SIGNING_GPG_KEY_NAME: ${{ secrets.SIGNING_GPG_KEY_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${ORG_GRADLE_PROJECT_mavenCentralUsername:-}" || -z "${ORG_GRADLE_PROJECT_mavenCentralPassword:-}" || -z "${SIGNING_GPG_PRIVATE_KEY:-}" || -z "${SIGNING_GPG_KEY_NAME:-}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        if: steps.gate.outputs.publish == 'true'
        env:
          SIGNING_GPG_PRIVATE_KEY: ${{ secrets.SIGNING_GPG_PRIVATE_KEY }}
          SIGNING_GPG_KEY_NAME: ${{ secrets.SIGNING_GPG_KEY_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$SIGNING_GPG_PRIVATE_KEY" | gpg --batch --import; then
            printf '%s' "$SIGNING_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          fi

      - name: Publish to Maven Central snapshots
        if: steps.gate.outputs.publish == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          SIGNING_GPG_KEY_NAME: ${{ secrets.SIGNING_GPG_KEY_NAME }}
          SIGNING_GPG_PASSPHRASE: ${{ secrets.SIGNING_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          signing_args=()
          if [[ -n "${SIGNING_GPG_KEY_NAME:-}" ]]; then
            signing_args=(-Psigning.gnupg.keyName="$SIGNING_GPG_KEY_NAME")
            if [[ -n "${SIGNING_GPG_PASSPHRASE:-}" ]]; then
              signing_args+=(-Psigning.gnupg.passphrase="$SIGNING_GPG_PASSPHRASE")
            fi
          fi
          ./gradlew publishToMavenCentral "${signing_args[@]}" \
            -Pkast.publish.target=snapshot \
            -Pversion="${{ needs.validate.outputs.snapshot-version }}" \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

  publish-snapshot-release:
    name: Publish installable snapshot
    needs:
      - validate
      - build-setup-bundles
      - publish-github-packages
      - publish-maven-central
    if: >-
      always() &&
      needs.validate.outputs.publish-snapshot == 'true' &&
      needs.build-setup-bundles.result == 'success' &&
      needs.publish-github-packages.result == 'success' &&
      needs.publish-maven-central.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source-sha }}

      - name: Download retained snapshot bundles
        uses: actions/download-artifact@v7
        with:
          pattern: setup-bundle-*-${{ github.run_id }}
          path: dist
          merge-multiple: true

      - name: Verify retained snapshot bundles
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            asset="dist/kast-${platform}-snapshot.tar.gz"
            scripts/verify-ci-artifact-ledger.py verify \
              --ledger "dist/provenance/build-ledger-setup-${platform}.json" \
              --git-sha "${{ needs.validate.outputs.source-sha }}" \
              --require-kind "release-setup-${platform}" \
              --artifact "release-setup-${platform}=${asset}"
            (cd dist && sha256sum -c "$(basename -- "$asset").sha256")
          done
          mapfile -t snapshot_bundles < <(find dist -maxdepth 1 -type f -name 'kast-*-snapshot.tar.gz' -print)
          [[ "${#snapshot_bundles[@]}" -eq 4 ]] \
            || { echo "Expected four snapshot bundles, found ${#snapshot_bundles[@]}" >&2; exit 1; }

      - name: Publish rolling snapshot prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ needs.validate.outputs.source-sha }}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            [[ "$current_main" == "$source_sha" ]] \
              || { echo "Refusing to publish stale snapshot ${source_sha}; main is ${current_main}" >&2; exit 1; }
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/snapshot" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/snapshot" \
              -f sha="$source_sha" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/snapshot \
              -f sha="$source_sha" >/dev/null
          fi

          printf -v notes 'Source: %s\nVersion: %s' \
            "$source_sha" \
            "${{ needs.validate.outputs.snapshot-tag }}"
          if gh release view snapshot --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit snapshot \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$source_sha" \
              --title "Latest snapshot" \
              --notes "$notes"
          else
            gh release create snapshot \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --target "$source_sha" \
              --title "Latest snapshot" \
              --notes "$notes"
          fi
          gh release upload snapshot \
            --repo "$GITHUB_REPOSITORY" \
            dist/kast-*-snapshot.tar.gz \
            dist/kast-*-snapshot.tar.gz.sha256 \
            --clobber
