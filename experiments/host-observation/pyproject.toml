[project]
name = "kast-agent-efficiency"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.14.1"]

[dependency-groups]
dev = ["ruff==0.17.2", "pyright[nodejs]==1.1.414", "pytest==9.1.1"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["agent_efficiency*.py", "efficiency-tests", "test_agent_efficiency*.py", "log_visibility.py", "log-tests", "campaign_queries.py", "campaign-tests"]
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["agent_efficiency*.py", "test_agent_efficiency*.py", "efficiency-tests/*.py", "log_visibility.py", "log-tests/*.py", "campaign_queries.py", "campaign-tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
python_files = ["test_agent_efficiency_metrics.py", "test_coordinator.py", "test_integrity.py", "test_optimization.py", "test_subject.py", "test_tokens.py", "test_timing.py", "test_log_visibility.py", "test_campaign_queries.py"]
pythonpath = ["."]
