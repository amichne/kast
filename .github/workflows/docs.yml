name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "README.md"
      - "docs/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Mintlify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/tooling/likec4/package-lock.json

      - name: Install Mintlify CLI
        run: npm install --global mint@4.2.841

      - name: Check generated architecture proof
        run: python3 docs/tooling/likec4/generate_bundle.py --check

      - name: Check documentation contract
        run: python3 docs/test_public_docs.py

      - name: Validate Mintlify build
        working-directory: docs/public
        run: mint validate
