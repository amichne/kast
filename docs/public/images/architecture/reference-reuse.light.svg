  <text x="223.88924999999995" y="198.788" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="223.88924999999995" dy="-3.9000000000000012">Same authority, subject,</tspan><tspan x="223.88924999999995" dy="16.900000000000002">scope, and purpose?</tspan></text>
