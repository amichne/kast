name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Prove exact assets, then publish
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Detach exact release source
        run: git checkout --detach "$GITHUB_SHA"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/tooling/likec4/package-lock.json

      - name: Install documentation validator
        run: npm install --global mint@4.2.841

      - name: Build and verify release assets
        run: >-
          bash .github/scripts/release/build-assets.sh
          --version "$RELEASE_VERSION"
          --source-revision "$GITHUB_SHA"

      - name: Publish immutable GitHub release
        run: >-
          bash .github/scripts/release/publish-release.sh
          --release "v${RELEASE_VERSION}"
          --commit "$GITHUB_SHA"
          --assets-directory "build/release/v${RELEASE_VERSION}"
