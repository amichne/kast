name: Isolated runtime candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact numeric version for the candidates
        required: true
        default: 0.0.0
        type: string
      action_revision:
        description: Retired archive-action input; must be empty
        required: false
        type: string
      linux_only:
        description: Assemble and qualify only Linux x86-64
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_target:
        description: Qualify one native target. The default is macOS ARM64.
        type: string
        required: false
        default: ''
      assembled_artifact_id:
        description: Exact assembled release artifact from the successful CI producer
        type: string
        required: false
      complete_product:
        description: Retain qualified targets with exact CI producer evidence
        type: boolean
        default: false
      version:
        description: Exact numeric version for the candidates
        required: true
        type: string
      action_revision:
        description: Retired archive-action input; must be empty
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUNDLE_VERSION: ${{ inputs.version }}
  ACTION_REVISION: ${{ inputs.action_revision }}

jobs:
  candidate:
    name: Build and qualify ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}{1}]',
          (inputs.release_target == 'linux-x86_64' || inputs.linux_only) && '{"target":"linux-x86_64","runner":"ubuntu-24.04","donor":"idea-2026.2.2.tar.gz"}' || '',
          inputs.release_target != 'linux-x86_64' && !inputs.linux_only && vars.KAST_MACOS_CHECKS == 'true' && '{"target":"macos-aarch64","runner":"macos-15","donor":"idea-2026.2.2-aarch64.dmg"}' || '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The pinned task runner comes first: every later step runs a `composed:` task.
      - name: Set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Admit source and version
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
          TARGET: ${{ matrix.target }}
        run: mise run composed:admit --target "$TARGET" --release-target "$RELEASE_TARGET"

      - name: Set up Python
        id: candidate-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check workspace and scratch free space
        run: mise run composed:storage

      - name: Prepare signed Linux support before compilation
        if: startsWith(matrix.target, 'linux-')
        env:
          TARGET: ${{ matrix.target }}
        run: mise run composed:linux-support --target "$TARGET"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Check shared composition Python source
        run: mise run composed:lint

      - name: Run composition tests on the target platform
        run: mise run composed:tests

      - name: Download exact macOS release candidate
        if: inputs.release_target == 'macos-aarch64' && !inputs.complete_product
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate-v${{ inputs.version }}-${{ github.sha }}
          path: build/release/v${{ inputs.version }}

      - name: Download the exact CI release
        if: inputs.complete_product && inputs.release_target == 'macos-aarch64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.assembled_artifact_id || '0' }}
          merge-multiple: true
          path: build/handoff-input/

      - name: Admit retained CI release identity and bytes
        if: inputs.complete_product && inputs.release_target == 'macos-aarch64'
        run: mise run composed:restore

      - name: Assemble bootstrap for the retained macOS release
        if: inputs.release_target == 'macos-aarch64' && !inputs.complete_product
        run: mise run composed:bootstrap

      - name: Assemble matching Control, Host, and bootstrap
        if: inputs.release_target != 'macos-aarch64'
        env:
          TARGET: ${{ matrix.target }}
        run: mise run composed:release --target "$TARGET"

      - name: Download pinned donor and assemble the archive
        shell: bash
        env:
          DONOR: ${{ matrix.donor }}
          TARGET: ${{ matrix.target }}
        run: mise run composed:assemble --target "$TARGET" --donor "$DONOR"

      - name: Re-admit unchanged source
        run: mise run composed:source

      - name: Retain the assembled candidate
        if: inputs.release_target == '' || inputs.complete_product
        id: candidate-artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kast-composed-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/composed-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain assembly evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kast-composed-assembly-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/cloud-input/linux-support/licenses/
            build/reports/
            /tmp/kp/donor-manifest.json
            /tmp/kp/p/composition-manifest.json
            /tmp/kp/p/installer.log
          if-no-files-found: warn
          retention-days: 14

      - name: Free assembly scratch space before qualification
        run: mise run composed:discard

      - name: Verify the exact component assembly
        timeout-minutes: 60
        shell: bash
        env:
          CANDIDATE_PYTHON: ${{ steps.candidate-python.outputs.python-path }}
          TARGET: ${{ matrix.target }}
        run: mise run composed:qualify --target "$TARGET"

      - name: Exercise the installed Linux coordinator
        if: github.event_name == 'workflow_dispatch' && inputs.linux_only && matrix.target == 'linux-x86_64'
        env:
          TARGET: ${{ matrix.target }}
        run: mise run composed:coordinator --target "$TARGET"

      - name: Retain assembly receipt beside its exact product bytes
        if: '!inputs.complete_product && !inputs.linux_only'
        env:
          TARGET: ${{ matrix.target }}
        run: mise run composed:receipt --target "$TARGET"

      - name: Seal native target and toolchain evidence for the exact CI attempt
        if: inputs.complete_product
        env:
          TARGET: ${{ matrix.target }}
        run: mise run composed:seal-target --target "$TARGET"

      - name: Retain target-local qualified product evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kast-qualified-product-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/composed-release/kast-composed-setup-v${{ inputs.version }}-${{ matrix.target }}.tar.gz
            build/composed-release/kast-runtime-v${{ inputs.version }}-${{ matrix.target }}.zip
            build/composed-release/kast-runtime-base-${{ matrix.target }}-*.zip
            build/composed-release/qualification-${{ matrix.target }}.json
            build/composed-release/target-record-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain qualified runtime for stable release
        if: inputs.release_target != '' && !inputs.complete_product
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kast-release-runtime-v${{ inputs.version }}-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/composed-release/kast-runtime-v${{ inputs.version }}-${{ matrix.target }}.zip
            build/composed-release/kast-runtime-v${{ inputs.version }}-${{ matrix.target }}.zip.sha256
            build/composed-release/kast-runtime-base-${{ matrix.target }}-*.zip
            build/composed-evidence/qualification.json
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kast-composed-evidence-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/composed-evidence/
            /tmp/kc/installer.log
            /tmp/kc/state/log/
          if-no-files-found: warn
          retention-days: 14
