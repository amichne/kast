name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish, and smoke-test
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify installer recovery flow
        run: bash packaging/test-installer.sh

      - name: Build and verify release assets
        run: >-
          bash .github/scripts/release/build-assets.sh
          --version "$RELEASE_VERSION"
          --source-revision "$GITHUB_SHA"

      - name: Admit release smoke runtime
        run: |
          idea_version="$(
            sed -nE 's/^idea-indexer = "([0-9]+(\.[0-9]+)+)"$/\1/p' \
              gradle/libs.versions.toml
          )"
          [[ -n "$idea_version" ]]
          idea_platform_home="$GRADLE_USER_HOME/kast/indexer-idea-distributions/$idea_version"
          [[ -f "$idea_platform_home/build.txt" ]]
          [[ -d "$idea_platform_home/plugins/Kotlin" ]]
          [[ -x "$JAVA_HOME/bin/java" ]]
          [[ -f "$JAVA_HOME/release" ]]
          printf 'KAST_RELEASE_IDEA_PLATFORM_HOME=%s\n' "$idea_platform_home" >> "$GITHUB_ENV"

      - name: Publish immutable GitHub release
        run: >-
          bash .github/scripts/release/publish-release.sh
          --release "v${RELEASE_VERSION}"
          --commit "$GITHUB_SHA"
          --assets-directory "build/release/v${RELEASE_VERSION}"

      - name: Verify fresh published sidecar installation
        run: >-
          bash packaging/verification/verify-published-sidecar-delivery.sh
          --release "v${RELEASE_VERSION}"
          --repository "$GITHUB_REPOSITORY"
          --idea-platform-home "$KAST_RELEASE_IDEA_PLATFORM_HOME"
          --java-home "$JAVA_HOME"
