name: OpenWiki Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Set up Python for the public OKF projection
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install the locked projection runtimes
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.12.9
          npm ci --ignore-scripts --engine-strict --prefix docs/tooling/markdown

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.9.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Reject unreconciled canonical prose before native update
        run: node docs/tooling/markdown/evidence-assess.ts --root "$GITHUB_WORKSPACE" --scope canonical --check-pages

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: "gpt-6-luna"
          # Local subscription login remains in the private OpenWiki environment.
          # This manually dispatched CI workflow needs its own API credential.
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"

      - name: Project completed OKF pages into the public site
        id: projection
        if: ${{ !cancelled() && (steps.openwiki.outcome == 'success' || steps.openwiki.outcome == 'failure') }}
        run: |
          git add -- openwiki
          uv run --locked --project docs/tooling python docs/tooling/okf_public.py --write

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: List OpenWiki update paths
        id: paths
        if: ${{ !cancelled() }}
        run: |
          uv run --locked --project docs/tooling python docs/tooling/okf_public.py --output-paths > "$RUNNER_TEMP/okf-output-paths.json"
          python3 - "$RUNNER_TEMP/okf-output-paths.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          paths = ["openwiki", *json.loads(Path(sys.argv[1]).read_text())["paths"]]
          with Path(sys.argv[2]).open("a") as output:
              output.write("list=" + ",".join(paths) + "\n")
          PY

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() && steps.projection.outcome == 'success' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: ${{ steps.paths.outputs.list }}
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure, with their public projections.
            A rejected projection prevents this PR. Partial progress does not satisfy
            the publication assessment or the complete canonical review.

      - name: Annotate OpenWiki update pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        run: echo "::notice title=OpenWiki update pull request::${{ steps.create-pr.outputs.pull-request-url }}"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
