      operationId: semanticGraph
      summary: Export a compiler-backed Kotlin semantic graph page
      tags:
        - read
      x-jsonrpc-method: raw/semantic-graph
      x-kast-required-capability: SEMANTIC_GRAPH
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SemanticGraphQuery"
      responses:
        200:
          description: JSON-RPC success result
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SemanticGraphResult"
        default:
          description: JSON-RPC error response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JsonRpcErrorResponse"
  "/rpc/raw/workspace-files-continuation":
    post:
      operationId: workspaceFilesContinuation
      summary: Issue or consume server-held public workspace-file continuation state
