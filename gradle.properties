GROUP=io.github.amichne
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Memory settings for java
org.gradle.jvmargs=-Xmx8g  -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.isolated-projects=true
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true
org.gradle.daemon=true


# Verify the checked dependency checksums for local builds, IDE sync, and CI.
org.gradle.dependency.verification=strict

# A repository that answers 429 or 5xx fails the build after these attempts, reported as "not found".
# Gradle's three attempts in under a second do not outlast a rate limit; six take about 30 seconds.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Persist Kotlin incremental-compilation evidence for CI diagnostics.
kotlin.build.report.output=file
