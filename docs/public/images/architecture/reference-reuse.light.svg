<g class="node" data-id="R" data-label="Confirm the
receiving relation" data-shape="stadium">
  <rect x="336.21975" y="522.1759999999999" width="144.949" height="53.800000000000004" rx="26.900000000000002" ry="26.900000000000002" fill="#E5F5EE" stroke="#278160" stroke-width="0.75" />
  <text x="408.69425" y="549.0759999999999" text-anchor="middle" font-size="13" font-weight="500" fill="#20231F"><tspan x="408.69425" dy="-3.9000000000000012">Confirm the</tspan><tspan x="408.69425" dy="16.900000000000002">receiving relation</tspan></text>
</g>
