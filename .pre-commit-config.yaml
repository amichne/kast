# Install once per clone:
#   mise run hooks
# Commit hooks stay cheap. Push hooks run the CI source obligations for the pushed
# change against the local Gradle caches, so a red CI run is a surprise, not a routine.
# Every entry is a mise task.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ci-decisions
        name: CI decision, candidate, and release preflight rules
        language: system
        entry: mise run ci:decisions
        files: ^(\.github/|distribution/release/|config/ci/|mise\.toml$|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: documentation-contracts
        name: Documentation parser, glossary, and knowledge contracts
        language: system
        entry: mise run docs:contracts
        files: ^(docs/|openwiki/|config/vale/|README\.md$|.*AGENTS\.md$|\.github/scripts/ci/verify_documentation\.py$)
        pass_filenames: false
        stages: [pre-push]

      - id: affected-source-obligations
        name: Affected source obligations (requires a clean committed tree)
        language: system
        entry: mise run affected
        always_run: true
        pass_filenames: false
        stages: [pre-push]
