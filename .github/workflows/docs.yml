name: Documentation

on:
  pull_request:
    paths:
      - ".python-version"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "docs/**"
      - "cli/**"
      - "install.sh"
      - "gradle/libs.versions.toml"
      - "protocol/contract/**"
      - "protocol/registry/**"
      - "protocol/wire/**"
  push:
    branches:
      - main
    paths:
      - ".python-version"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "docs/**"
      - "cli/**"
      - "install.sh"
      - "gradle/libs.versions.toml"
      - "protocol/contract/**"
      - "protocol/registry/**"
      - "protocol/wire/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Mintlify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/tooling/likec4/package-lock.json

      - name: Install Mintlify CLI
        run: npm install --global mint@4.2.841

      - name: Generate canonical operation registry
        run: ./gradlew :protocol:wire:generateOperationRegistry

      - name: Check generated architecture proof
        run: python3 docs/tooling/likec4/generate_bundle.py --check

      - name: Check documentation contract
        run: python3 docs/test_public_docs.py

      - name: Validate Mintlify build
        working-directory: docs/public
        run: mint validate
