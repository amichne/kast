name: Developer release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main CI run whose retained bytes to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: developer-release
  cancel-in-progress: false

jobs:
  publish:
    name: Promote tested bytes to the developer channel
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Admit successful producer and merged source tree
        id: candidate
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MAIN_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: >-
          python3 .github/scripts/release/build_candidate.py promote
          --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA"
          --run-id "$MAIN_RUN_ID" --bundle build/candidate
          --promotion-record build/promotion.json --github-output "$GITHUB_OUTPUT"

      - name: Publish retained candidate and latest pointer
        env:
          BUILD_SOURCE_SHA: ${{ steps.candidate.outputs.source_revision }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: >-
          bash .github/scripts/release/publish-developer.sh
          --version "$CANDIDATE_VERSION" --commit "$BUILD_SOURCE_SHA"
          --assets-directory build/candidate/payload
          --promotion-record build/promotion.json
