name: Publish agent marketplace

# Agents clone a marketplace repository whole. This keeps the Kast plugin in a small repository of its own,
# so an agent never clones the Kast source history to install or update it.
on:
  workflow_call:
    inputs:
      public_version:
        required: true
        type: string
    secrets:
      KAST_PLUGINS_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      public_version:
        description: Published stable version to project (for example 0.55.0)
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Project the stable marketplace into amichne/kast-plugins
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the marketplace repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amichne/kast-plugins
          ref: main
          path: build/marketplace
          ssh-key: ${{ secrets.KAST_PLUGINS_DEPLOY_KEY }}

      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Publish the admitted marketplace
        env:
          PUBLIC_VERSION: ${{ inputs.public_version }}
        run: mise run release:marketplace
