name: Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact published preview tag (developer-v0.0.RUN)
        required: true
        type: string
      record_sha256:
        description: SHA-256 of that immutable build-record.json
        required: true
        type: string
      public_version:
        description: Public semantic version to map to the retained build
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Promote retained preview bytes without building
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      RECORD_SHA256: ${{ inputs.record_sha256 }}
      PUBLIC_VERSION: ${{ inputs.public_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: Admit published inventory and promote identical archives
        run: mise run release:stable

  marketplace:
    name: Publish the agent marketplace
    needs: publish
    uses: ./.github/workflows/publish-marketplace.yml
    with:
      public_version: ${{ inputs.public_version }}
    secrets:
      KAST_PLUGINS_DEPLOY_KEY: ${{ secrets.KAST_PLUGINS_DEPLOY_KEY }}
