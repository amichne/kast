GROUP=io.github.amichne
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Memory settings for java
org.gradle.jvmargs=-Xmx8g  -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true
org.gradle.daemon=true

# Make an explicitly supplied GraalVM visible to Native Image toolchain selection.
org.gradle.java.installations.fromEnv=GRAALVM_HOME

# Verify the checked dependency checksums for local builds, IDE sync, and CI.
org.gradle.dependency.verification=strict

# Persist Kotlin incremental-compilation evidence for CI diagnostics.
kotlin.build.report.output=file
