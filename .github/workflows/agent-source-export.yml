name: Agent source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package tracked source
        run: git archive --format=tar.gz --output=/tmp/kast-source.tar.gz HEAD

      - name: Upload tracked source
        uses: actions/upload-artifact@v4
        with:
          name: kast-source-${{ github.sha }}
          path: /tmp/kast-source.tar.gz
          if-no-files-found: error
          retention-days: 1
