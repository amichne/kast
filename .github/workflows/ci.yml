name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      rollout:
        description: Frozen CI corpus phase
        type: choice
        default: none
        options: [none, warm, changed, reuse, cold]
      rollout_case:
        description: Frozen case to measure through its own aggregate
        type: choice
        default: all
        options: [all, documentation, leaf-service, semantic-adapter, shared-contract]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KAST_SEMANTIC_FIXTURES: ${{ vars.KAST_SEMANTIC_FIXTURES || 'false' }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.rollout_case && inputs.rollout_case != 'all' && format('-{0}', inputs.rollout_case) || '' }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
      product: ${{ steps.scope.outputs.product }}
      portable: ${{ steps.scope.outputs.portable }}
      documentation: ${{ steps.scope.outputs.documentation }}
      gate_graph: ${{ steps.scope.outputs.gate_graph }}
      scope: ${{ steps.scope.outputs.scope }}
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test CI decisions
        run: |
          echo "Semantic fixture switch: $KAST_SEMANTIC_FIXTURES" >> "$GITHUB_STEP_SUMMARY"
          python3 -m unittest discover -s .github/scripts/ci -p 'test_*.py'
          python3 .github/scripts/release/test_build_candidate.py

      - name: Select checks
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/ci/validation_scope.py \
            --affected \
            --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" \
            --head "$CHECKOUT_SHA" --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  documentation:
    needs: scope
    if: needs.scope.outputs.documentation == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    uses: ./.github/workflows/docs.yml

  portable:
    needs: scope
    if: needs.scope.outputs.portable == 'run'
    name: Offline packaging in disposable container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run offline packaging suites
        run: ./packaging/run-portable-tests-container.sh

  source-work:
    needs: scope
    if: needs.scope.outputs.source == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    name: Source obligations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      candidate: ${{ steps.reuse.outputs.candidate || 'MISSING' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reuse tested merged PR candidate
        if: needs.scope.outputs.product == 'run' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.KAST_SEMANTIC_FIXTURES == 'false'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release/build_candidate.py reuse
          --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"
          --bundle build/candidate --github-output "$GITHUB_OUTPUT"

      - name: Set up GraalVM Java 25
        if: steps.reuse.outputs.candidate != 'REUSED'
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: 25.0.2

      - name: Set up Python
        if: steps.reuse.outputs.candidate != 'REUSED'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol and semantic test tools
        if: steps.reuse.outputs.candidate != 'REUSED'
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt uv==0.12.9

      - name: Set up documentation parser runtime
        if: steps.reuse.outputs.candidate != 'REUSED'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Set up Gradle
        if: steps.reuse.outputs.candidate != 'REUSED'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Main entries are visible to other PRs; PR-scoped writes cannot warm them.
          # A main workflow_dispatch performs a full build to seed/refresh these entries.
          cache-read-only: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
          cache-cleanup: on-success
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          # Cacheable IDEA extraction tasks restore their outputs from that cache. Cache the non-cacheable topology Sync separately.
          gradle-home-cache-includes: |
            caches
            notifications
            native-build-tools
            kast/topology-intellij-kotlin-plugin

      - name: Validate affected source obligations
        if: needs.scope.outputs.product == 'skip'
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_VERIFICATION_PLAN: ${{ needs.scope.outputs.plan }}
        run: python3 .github/scripts/ci/source_validation.py --affected --base "$BASE_SHA" --event "$GITHUB_EVENT_NAME"

      - name: Validate complete candidate source obligations
        if: needs.scope.outputs.product == 'run' && steps.reuse.outputs.candidate != 'REUSED'
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
        run: python3 .github/scripts/ci/source_validation.py

      - name: Examine candidate gate membership
        if: needs.scope.outputs.product == 'run' && steps.reuse.outputs.candidate != 'REUSED'
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          GATE_GRAPH: ${{ needs.scope.outputs.gate_graph }}
        run: python3 .github/scripts/ci/verify-checks.py --preflight-only --gate-graph "$GATE_GRAPH"

      - name: Prepare compiled native inputs
        if: needs.scope.outputs.product == 'run' && steps.reuse.outputs.candidate != 'REUSED'
        run: uv run --locked --script .github/scripts/ci/native_handoff.py inputs --version "0.0.$GITHUB_RUN_NUMBER"

      - name: Retain compiled native inputs
        if: needs.scope.outputs.product == 'run' && steps.reuse.outputs.candidate != 'REUSED'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-output/
          if-no-files-found: error
          retention-days: 7

      - name: Retain reused candidate
        if: steps.reuse.outputs.candidate == 'REUSED'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reused-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Retain source evidence
        if: always() && steps.reuse.outputs.candidate != 'REUSED' && (inputs.rollout == '' || inputs.rollout == 'none')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-source-reports-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: error
          retention-days: 14

  native:
    name: Compile macOS native executable
    needs: [scope, source-work]
    if: needs.scope.outputs.product == 'run' && needs.source-work.outputs.candidate != 'REUSED'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: 25.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python3 -m pip install uv==0.12.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-input/
      - name: Compile and examine the native executable
        run: >-
          python3 .github/scripts/ci/build_execution.py
          --report build/reports/ci/build-execution.json
          --native-report build/reports/native/build-output.json --
          uv run --locked --script .github/scripts/ci/native_handoff.py native --version "0.0.$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-executable-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-output/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  assembly:
    name: Assemble release on Linux
    needs: [scope, native]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: 25.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python3 -m pip install uv==0.12.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-executable-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-input/
      - name: Admit native output and assemble the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --script .github/scripts/ci/native_handoff.py assemble --version "0.0.$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: assembled-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-output/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: assembly-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  kotlin:
    name: Kotlin product
    needs: [scope, source-work, native, assembly]
    if: always() && needs.scope.outputs.product == 'run' && needs.source-work.result == 'success' && (needs.source-work.outputs.candidate == 'REUSED' || (needs.native.result == 'success' && needs.assembly.result == 'success')) && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.KAST_SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted", "macOS", "ARM64", "kast-main"]') || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.source-work.outputs.candidate == 'REUSED'
        with:
          name: reused-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/candidate/
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: needs.source-work.outputs.candidate != 'REUSED'
        with:
          distribution: graalvm
          java-version: 25.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.source-work.outputs.candidate != 'REUSED' && runner.environment != 'self-hosted'
        with:
          python-version-file: .python-version
      - run: python3 -m pip install uv==0.12.9
        if: needs.source-work.outputs.candidate != 'REUSED' && runner.environment != 'self-hosted'
      - name: Set up local Python
        if: needs.source-work.outputs.candidate != 'REUSED' && runner.environment == 'self-hosted'
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: |
          uv python install "$(cat .python-version)"
          uv venv --allow-existing --seed --python "$(cat .python-version)" "$RUNNER_TOOL_CACHE/kast-ci-python"
          echo "$RUNNER_TOOL_CACHE/kast-ci-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TOOL_CACHE/kast-ci-python/bin/python3" -m pip install uv==0.12.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.source-work.outputs.candidate != 'REUSED'
        with:
          name: assembled-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-input/
      - name: Exercise the assembled Mac product
        if: needs.source-work.outputs.candidate != 'REUSED'
        run: uv run --locked --script .github/scripts/ci/native_handoff.py qualify --version "0.0.$GITHUB_RUN_NUMBER"
      - name: Seal tested candidate identity
        if: needs.source-work.outputs.candidate != 'REUSED'
        env:
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/release/build_candidate.py seal
          --repository "$GITHUB_REPOSITORY" --revision "$CHECKOUT_SHA"
          --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --event "$GITHUB_EVENT_NAME" --bundle build/candidate
      - name: Retain immutable build candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-build-candidate-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: build/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  source:
    name: Source validation
    needs: [scope, source-work]
    if: always() && needs.scope.outputs.source == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require the selected source-proof producer
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py --source-proof

  source-feedback:
    name: Source feedback
    needs: [scope, source, documentation, portable]
    if: always() && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require source obligations
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py --source-feedback

  required:
    name: CI required checks
    needs: [scope, source, documentation, portable, kotlin]
    if: always() && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py

      - name: Seal successful validation outcome
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci/validation_outcome.py --affected --record build/validation/validation.json

      - name: Retain exact validation outcome
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-validation-outcome-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: build/validation/validation.json
          if-no-files-found: error
          retention-days: 30

  rollout:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.rollout != 'none'
    name: Frozen rollout (${{ matrix.case }}, ${{ inputs.rollout }})
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.rollout_case == 'all' && '["documentation","leaf-service","semantic-adapter","shared-contract"]' || format('["{0}"]', inputs.rollout_case)) }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up GraalVM Java 25
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: 25.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: ${{ inputs.rollout != 'cold' && 'pip' || '' }}
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol and semantic test tools
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt uv==0.12.9

      - name: Set up documentation parser runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          validate-wrappers: true
          cache-disabled: ${{ inputs.rollout == 'cold' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Only the explicit rollout warm-up writes this branch-scoped cache.
          # Routine PR policy remains read-only.
          cache-read-only: ${{ inputs.rollout != 'warm' }}
          cache-cleanup: on-success
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          # Cacheable IDEA extraction tasks restore their outputs from that cache. Cache the non-cacheable topology Sync separately.
          gradle-home-cache-includes: |
            caches
            notifications
            native-build-tools
            kast/topology-intellij-kotlin-plugin

      - name: Replay frozen change
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          ROLLOUT_CASE: ${{ matrix.case }}
          ROLLOUT_MODE: ${{ inputs.rollout }}
        run: python3 .github/scripts/ci/rollout.py --case "$ROLLOUT_CASE" --mode "$ROLLOUT_MODE"

      - name: Retain source evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-rollout-${{ matrix.case }}-${{ inputs.rollout }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: error
          retention-days: 14

  rollout-feedback:
    name: Frozen rollout feedback
    needs: [scope, rollout, portable]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.rollout != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Require every corpus result and portable checks
        env:
          ROLLOUT_SUCCESS: ${{ needs.scope.result == 'success' && needs.rollout.result == 'success' && needs.portable.result == 'success' }}
        run: test "$ROLLOUT_SUCCESS" = true
