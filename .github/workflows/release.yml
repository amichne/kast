name: Release
run-name: >-
  Release
  ${{
    github.event_name == 'workflow_dispatch'
      && format('{0} ({1})', inputs.release_type, github.ref_name)
      || github.ref_name
  }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_type:
        description: >
          Release type. Stable releases increment the latest vX.Y.Z tag.
          Beta releases append the short commit SHA.
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - beta

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Preflight release automation
    runs-on: ubuntu-22.04
    outputs:
      run_id: ${{ steps.exact-source-ci.outputs.run_id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require green exact-source CI
        id: exact-source-ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'error: stable release dispatch must target refs/heads/main\n' >&2
            exit 1
          fi
          ci_runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$GITHUB_SHA" \
            -f status=success \
            -f per_page=100)"
          ci_run_id="$(jq -er --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha
              and .head_branch == "main"
              and .path == ".github/workflows/ci.yml"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success")]
            | sort_by(.run_attempt)
            | last
            | .id
          ' <<<"$ci_runs")" \
            || { printf 'error: exact source CI is not green for %s\n' "$GITHUB_SHA" >&2; exit 1; }
          ci_artifacts="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/artifacts" \
            -f name=ci-artifact-ledger-maven-publication \
            -f per_page=100)"
          jq -e '
            any(.artifacts[];
              .name == "ci-artifact-ledger-maven-publication"
              and .expired == false)
          ' <<<"$ci_artifacts" >/dev/null \
            || { printf 'error: exact-source CI Maven evidence is unavailable for %s\n' "$GITHUB_SHA" >&2; exit 1; }
          printf 'run_id=%s\n' "$ci_run_id" >>"$GITHUB_OUTPUT"

  bump-version:
    name: Bump version (${{ inputs.release_type }})
    needs: [release-preflight]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.bump.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Compute next semver tag and push
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          release_type="${{ inputs.release_type }}"
          short_sha="${GITHUB_SHA:0:7}"
          latest_stable="$(git tag --list 'v*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [[ -z "$latest_stable" ]]; then
            latest_stable="v0.0.0"
          fi
          base="${latest_stable#v}"
          IFS='.' read -r major minor patch <<< "$base"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"

          case "$release_type" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              new_tag="v${major}.${minor}.${patch}"
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              new_tag="v${major}.${minor}.${patch}"
              ;;
            patch)
              patch=$((patch + 1))
              new_tag="v${major}.${minor}.${patch}"
              ;;
            beta)
              patch=$((patch + 1))
              new_tag="v${major}.${minor}.${patch}-beta.${short_sha}"
              ;;
            *)
              echo "Unknown release_type: ${release_type}" >&2
              exit 1
              ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$new_tag"
          git push origin "$new_tag"
          printf 'release_tag=%s\n' "$new_tag" >> "$GITHUB_OUTPUT"

  prepare-release:
    name: Prepare release
    needs: [release-preflight, bump-version]
    if: always() && github.event_name == 'push' && needs.release-preflight.result == 'success' && needs.bump-version.result == 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release-tag.outputs.value }}
      release_version: ${{ steps.release-tag.outputs.version }}
      source_ci_run_id: ${{ needs.release-preflight.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ needs.bump-version.outputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "$tag" == v* ]] || { echo "release tag must start with v: $tag" >&2; exit 1; }
          printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release-tag.outputs.value }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi

  build-openapi-spec:
    name: Build OpenAPI spec
    needs:
      - prepare-release
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Stage OpenAPI spec
        run: >
          ./scripts/ci-gradle-retry.sh
          ./gradlew
          stageOpenApiSpec
          -Pversion="${{ needs.prepare-release.outputs.release_version }}"
          --no-daemon
          --stacktrace

      - name: Generate OpenAPI provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - "dist/openapi.yaml" "dist/build-provenance-openapi.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          asset = Path(sys.argv[1])
          payload = {
              "runId": os.environ["GITHUB_RUN_ID"],
              "runNumber": os.environ["GITHUB_RUN_NUMBER"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "actor": os.environ["GITHUB_ACTOR"],
              "platformId": "openapi",
              "assetName": asset.name,
              "assetDigest": "sha256:" + hashlib.sha256(asset.read_bytes()).hexdigest(),
          }
          Path(sys.argv[2]).write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          scripts/verify-ci-artifact-ledger.py record \
            --output dist/build-ledger-openapi.json \
            --git-sha "$GITHUB_SHA" \
            --source-ref "refs/tags/${{ needs.prepare-release.outputs.release_tag }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind release-openapi \
            --artifact-name openapi.yaml \
            --artifact-path dist/openapi.yaml \
            --producer-job build-openapi-spec \
            --build-command-id release-stage-openapi-spec

      - name: Upload OpenAPI workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: openapi-spec-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-openapi-spec:
    name: Publish OpenAPI spec
    needs:
      - prepare-release
      - build-openapi-spec
    if: always() && needs.prepare-release.result == 'success' && needs.build-openapi-spec.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Download retained OpenAPI asset
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec-${{ github.run_id }}
          path: dist

      - name: Verify and publish retained OpenAPI asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare-release.outputs.release_tag }}"
          scripts/verify-ci-artifact-ledger.py verify \
            --ledger dist/build-ledger-openapi.json \
            --git-sha "$GITHUB_SHA" \
            --require-kind release-openapi \
            --artifact release-openapi=dist/openapi.yaml
          .github/scripts/release/upload-immutable-release-asset.sh \
            --tag "$tag" \
            --asset dist/openapi.yaml

      - name: Retain OpenAPI provenance
        uses: actions/upload-artifact@v6
        with:
          name: openapi-provenance-${{ github.run_id }}
          path: dist/build-provenance-openapi.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish-maven-central:
    name: Publish Maven Central
    needs: [prepare-release]
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Download exact-source CI Maven validation ledger
        uses: actions/download-artifact@v7
        with:
          name: ci-artifact-ledger-maven-publication
          path: ci-ledgers
          run-id: ${{ needs.prepare-release.outputs.source_ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact-source CI Maven validation ledger
        env:
          SOURCE_CI_RUN_ID: ${{ needs.prepare-release.outputs.source_ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg run_id "$SOURCE_CI_RUN_ID" '
            .workflowRunId == $run_id
            and .sourceRef == "refs/heads/main"
          ' ci-ledgers/maven-publication.json >/dev/null \
            || { printf 'error: Maven ledger provenance does not match exact-source CI\n' >&2; exit 1; }
          scripts/verify-ci-artifact-ledger.py verify \
            --ledger ci-ledgers/maven-publication.json \
            --git-sha "$GITHUB_SHA" \
            --require-kind ci-maven-publication-validation

      - name: Check Maven Central publication state
        id: maven-state
        shell: bash
        run: |
          set -euo pipefail
          set +e
          state="$(scripts/release/verify-maven-central.sh \
            --version "${{ needs.prepare-release.outputs.release_version }}" \
            --classify)"
          verifier_exit="$?"
          set -e
          if [[ "$verifier_exit" -ne 0 ]]; then
            if [[ "$state" == "partial" ]]; then
              echo "::warning::Maven Central has a partial publication for ${{ needs.prepare-release.outputs.release_version }}; waiting for all modules."
              if scripts/release/verify-maven-central.sh \
                --version "${{ needs.prepare-release.outputs.release_version }}" \
                --attempts 30 \
                --delay-seconds 20; then
                state="all"
              else
                echo "::warning::Maven Central remains partial; final Maven verification will decide the job result."
              fi
            else
              exit "$verifier_exit"
            fi
          fi
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" == "all" ]]; then
            echo "Maven Central already has all public modules for ${{ needs.prepare-release.outputs.release_version }}."
          fi

      - name: Check Maven Central and signing secrets
        if: steps.maven-state.outputs.state == 'none'
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for secret_name in \
            ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME \
            ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD \
            SIGNING_GPG_KEY_NAME \
            SIGNING_GPG_PRIVATE_KEY \
            SIGNING_GPG_PASSPHRASE
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing ${secret_name} secret"
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo "::error::Missing Maven Central or signing secrets and release modules are not yet published."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          SIGNING_GPG_KEY_NAME: ${{ secrets.SIGNING_GPG_KEY_NAME }}
          SIGNING_GPG_PRIVATE_KEY: ${{ secrets.SIGNING_GPG_PRIVATE_KEY }}
          SIGNING_GPG_PASSPHRASE: ${{ secrets.SIGNING_GPG_PASSPHRASE }}

      - name: Import GPG key
        if: steps.maven-state.outputs.state == 'none' && steps.gate.outputs.publish == 'true'
        env:
          SIGNING_GPG_PRIVATE_KEY: ${{ secrets.SIGNING_GPG_PRIVATE_KEY }}
          SIGNING_GPG_KEY_NAME: ${{ secrets.SIGNING_GPG_KEY_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$SIGNING_GPG_PRIVATE_KEY" | gpg --batch --import; then
            printf '%s' "$SIGNING_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          fi
          gpg --list-secret-keys --keyid-format=long "$SIGNING_GPG_KEY_NAME"

      - name: Publish to Maven Central
        if: steps.maven-state.outputs.state == 'none' && steps.gate.outputs.publish == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          SIGNING_GPG_KEY_NAME: ${{ secrets.SIGNING_GPG_KEY_NAME }}
          SIGNING_GPG_PASSPHRASE: ${{ secrets.SIGNING_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          signing_args=(-Psigning.gnupg.keyName="$SIGNING_GPG_KEY_NAME")
          if [[ -n "${SIGNING_GPG_PASSPHRASE:-}" ]]; then
            signing_args+=(-Psigning.gnupg.passphrase="$SIGNING_GPG_PASSPHRASE")
          fi
          set +e
          ./scripts/ci-gradle-retry.sh ./gradlew publishAndReleaseToMavenCentral "${signing_args[@]}" \
            -Pkast.publish.target=release \
            -Pversion="${{ needs.prepare-release.outputs.release_version }}" \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace
          publish_exit="$?"
          set -e
          if [[ "$publish_exit" -ne 0 ]]; then
            echo "::warning::Gradle Maven Central publication exited with ${publish_exit}; verifying published coordinates before final Maven verification."
          fi
          set +e
          scripts/release/verify-maven-central.sh \
            --version "${{ needs.prepare-release.outputs.release_version }}" \
            --attempts 30 \
            --delay-seconds 20
          verify_exit="$?"
          set -e
          if [[ "$verify_exit" -eq 0 && "$publish_exit" -ne 0 ]]; then
            echo "Maven Central verification passed after Gradle exited with ${publish_exit}."
          elif [[ "$verify_exit" -ne 0 ]]; then
            echo "::warning::Maven Central verification did not pass in the publish step; final Maven verification will decide the job result."
          fi

      - name: Verify Maven Central publication
        shell: bash
        run: |
          scripts/release/verify-maven-central.sh \
            --version "${{ needs.prepare-release.outputs.release_version }}" \
            --attempts 30 \
            --delay-seconds 20

  build-cli:
    name: Build private CLI input (${{ matrix.asset_id }})
    needs: [prepare-release]
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_id: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cache_key: source-bound-cli-release
          - asset_id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cache_key: release-cli-linux-arm64
          - asset_id: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cache_key: release-cli-macos-x64
          - asset_id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            cache_key: release-cli-macos-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
      - uses: ./.github/scripts/release/actions/build-cli
        with:
          asset_id: ${{ matrix.asset_id }}
          target: ${{ matrix.target }}
          cache_key: ${{ matrix.cache_key }}
          release_tag: ${{ needs.prepare-release.outputs.release_tag }}
          release_version: ${{ needs.prepare-release.outputs.release_version }}

  build-agent-resources:
    name: Build agent resource assets
    needs: [prepare-release]
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Build deterministic agent resources
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare-release.outputs.release_tag }}"
          output="dist/agent-resources"
          .github/scripts/release/agent-resource-assets.py build \
            --source cli-rs/resources/kast \
            --output "$output" \
            --tag "$tag" \
            --git-sha "$GITHUB_SHA"
          .github/scripts/release/agent-resource-assets.py verify \
            --release-dir "$output" \
            --tag "$tag" \
            --git-sha "$GITHUB_SHA"
          mkdir -p dist/agent-resource-ledgers
          for specification in \
            "codex-archive|kast-codex-${tag}.tar" \
            "codex-checksum|kast-codex-${tag}.tar.sha256sum" \
            "claude-archive|kast-claude-${tag}.tar" \
            "claude-checksum|kast-claude-${tag}.tar.sha256sum" \
            "copilot-archive|kast-copilot-${tag}.tar" \
            "copilot-checksum|kast-copilot-${tag}.tar.sha256sum" \
            "provenance|kast-agent-resources-provenance.json"
          do
            IFS='|' read -r asset_id asset_name <<<"$specification"
            scripts/verify-ci-artifact-ledger.py record \
              --output "dist/agent-resource-ledgers/${asset_id}.json" \
              --git-sha "$GITHUB_SHA" \
              --source-ref "refs/tags/${tag}" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --artifact-kind "release-agent-resource-${asset_id}" \
              --artifact-name "$asset_name" \
              --artifact-path "${output}/${asset_name}" \
              --producer-job build-agent-resources \
              --build-command-id release-agent-resources
          done

      - name: Retain agent resource assets
        uses: actions/upload-artifact@v6
        with:
          name: agent-resources-${{ github.run_id }}
          path: |
            dist/agent-resources/
            dist/agent-resource-ledgers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-agent-resources:
    name: Publish agent resource assets
    needs:
      - prepare-release
      - build-agent-resources
    if: always() && needs.prepare-release.result == 'success' && needs.build-agent-resources.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Download retained agent resource assets
        uses: actions/download-artifact@v7
        with:
          name: agent-resources-${{ github.run_id }}
          path: dist

      - name: Verify and publish retained agent resource assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare-release.outputs.release_tag }}"
          output="dist/agent-resources"
          .github/scripts/release/agent-resource-assets.py verify \
            --release-dir "$output" \
            --tag "$tag" \
            --git-sha "$GITHUB_SHA"
          ledger_args=()
          required_kind_args=()
          artifact_args=()
          for specification in \
            "codex-archive|kast-codex-${tag}.tar" \
            "codex-checksum|kast-codex-${tag}.tar.sha256sum" \
            "claude-archive|kast-claude-${tag}.tar" \
            "claude-checksum|kast-claude-${tag}.tar.sha256sum" \
            "copilot-archive|kast-copilot-${tag}.tar" \
            "copilot-checksum|kast-copilot-${tag}.tar.sha256sum" \
            "provenance|kast-agent-resources-provenance.json"
          do
            IFS='|' read -r asset_id asset_name <<<"$specification"
            artifact_kind="release-agent-resource-${asset_id}"
            ledger_args+=(--ledger "dist/agent-resource-ledgers/${asset_id}.json")
            required_kind_args+=(--require-kind "$artifact_kind")
            artifact_args+=(--artifact "${artifact_kind}=${output}/${asset_name}")
          done
          scripts/verify-ci-artifact-ledger.py verify \
            "${ledger_args[@]}" \
            --git-sha "$GITHUB_SHA" \
            "${required_kind_args[@]}" \
            "${artifact_args[@]}"
          for asset in \
            "$output/kast-codex-${tag}.tar" \
            "$output/kast-codex-${tag}.tar.sha256sum" \
            "$output/kast-claude-${tag}.tar" \
            "$output/kast-claude-${tag}.tar.sha256sum" \
            "$output/kast-copilot-${tag}.tar" \
            "$output/kast-copilot-${tag}.tar.sha256sum" \
            "$output/kast-agent-resources-provenance.json"
          do
            .github/scripts/release/upload-immutable-release-asset.sh \
              --tag "$tag" \
              --asset "$asset"
          done

  build-indexer:
    name: Build indexer
    needs: [prepare-release]
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Free disk for indexer packaging
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Build retained indexer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf indexer/build/portable-dist indexer/build/distributions
          ./scripts/ci-gradle-retry.sh ./gradlew \
            -Pversion="${{ needs.prepare-release.outputs.release_version }}" \
            :indexer:syncRuntimeLibs \
            :indexer:syncPortableDist \
            :indexer:verifyPortableDistLayout \
            :indexer:portableDistZip \
            --no-daemon
          mapfile -t indexer_zips < <(find indexer/build/distributions -maxdepth 1 -type f -name 'indexer-*-portable.zip' -print)
          [[ "${#indexer_zips[@]}" -eq 1 ]] \
            || { echo "Expected one portable indexer zip, found ${#indexer_zips[@]}" >&2; exit 1; }
          mkdir -p dist
          cp "${indexer_zips[0]}" dist/indexer.zip
          scripts/verify-ci-artifact-ledger.py record \
            --output dist/build-ledger-indexer.json \
            --git-sha "$GITHUB_SHA" \
            --source-ref "refs/tags/${{ needs.prepare-release.outputs.release_tag }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind release-indexer \
            --artifact-name indexer.zip \
            --artifact-path dist/indexer.zip \
            --producer-job build-indexer \
            --build-command-id release-indexer-build

      - name: Retain indexer
        uses: actions/upload-artifact@v6
        with:
          name: indexer-${{ github.run_id }}
          path: |
            dist/indexer.zip
            dist/build-ledger-indexer.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-setup-bundles:
    name: Build setup bundle (${{ matrix.platform }})
    needs:
      - prepare-release
      - build-cli
      - build-indexer
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build-cli.result == 'success' &&
      needs.build-indexer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
      - uses: ./.github/scripts/release/actions/build-setup-bundle
        with:
          platform: ${{ matrix.platform }}
          tag: ${{ needs.prepare-release.outputs.release_tag }}

  publish-setup-bundles:
    name: Publish setup bundle (${{ matrix.platform }})
    needs:
      - prepare-release
      - build-setup-bundles
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build-setup-bundles.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
      - uses: ./.github/scripts/release/actions/publish-setup-bundle
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        with:
          platform: ${{ matrix.platform }}
          tag: ${{ needs.prepare-release.outputs.release_tag }}


  real-repository-indexing:
    name: Index ${{ matrix.name }}
    needs:
      - prepare-release
      - build-setup-bundles
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build-setup-bundles.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ktor
            repository: https://github.com/ktorio/ktor-samples.git
            revision: c89f051e1183455eda8b26146555a1b5ed23d18c
            graph_file: httpbin/src/main/kotlin/io/ktor/samples/httpbin/Server.kt
            relationships_enabled: true
          - name: spring-boot
            repository: https://github.com/AleksK1NG/Kotlin-Clean-Architecture-CQRS.git
            revision: d523770246f2ddb586868e4a9e55cafce7e0d6f8
            graph_file: src/main/kotlin/com/alexander/bryksin/kotlinspringcleanarchitecture/KotlinSpringCleanArchitectureApplication.kt
            relationships_enabled: true
          - name: okhttp
            repository: https://github.com/square/okhttp.git
            revision: 0960b47ec28a02e893499d2a7e53bf462a62875e
            graph_file: okcurl/src/main/kotlin/okhttp3/curl/Main.kt
            relationships_enabled: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Set up Gradle Java 17 toolchain
        id: gradle-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          set-default: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore repository object cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/kast-real-repository-cache
          key: kast-real-repository-${{ matrix.name }}-${{ matrix.revision }}

      - name: Download canonical Linux setup bundle
        uses: actions/download-artifact@v7
        with:
          name: setup-bundle-linux-x64-${{ github.run_id }}
          path: release-bundle

      - name: Index pinned repository
        shell: bash
        env:
          GRADLE_JAVA_HOME: ${{ steps.gradle-java.outputs.path }}
        run: |
          set -euo pipefail
          bundle="$(find release-bundle -maxdepth 1 -name 'kast-linux-x64-*.tar.gz' -print -quit)"
          [[ -n "$bundle" ]] || { echo "Linux setup bundle not found" >&2; exit 1; }
          scripts/release/benchmark-real-repositories.sh \
            --name "${{ matrix.name }}" \
            --repository "${{ matrix.repository }}" \
            --revision "${{ matrix.revision }}" \
            --graph-file "${{ matrix.graph_file }}" \
            --relationships-enabled "${{ matrix.relationships_enabled }}" \
            --bundle "$bundle" \
            --cache-root "${{ runner.temp }}/kast-real-repository-cache"


  build-release-metadata:
    name: Build release metadata
    needs:
      - prepare-release
      - publish-openapi-spec
      - publish-agent-resources
      - publish-setup-bundles
      - real-repository-indexing
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.publish-openapi-spec.result == 'success' &&
      needs.publish-agent-resources.result == 'success' &&
      needs.publish-setup-bundles.result == 'success' &&
      needs.real-repository-indexing.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download OpenAPI provenance
        uses: actions/download-artifact@v7
        with:
          path: provenance-openapi
          pattern: openapi-provenance-*
          merge-multiple: true

      - name: Download setup bundle provenance
        uses: actions/download-artifact@v7
        with:
          path: provenance-setup
          pattern: setup-bundle-provenance-*-${{ github.run_id }}
          merge-multiple: true

      - name: Assemble combined provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/assemble-release-provenance.py \
            --output dist/build-provenance.json \
            --tag "${{ needs.prepare-release.outputs.release_tag }}" \
            provenance-openapi \
            provenance-setup

      - name: Generate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare-release.outputs.release_tag }}"
          rm -rf release-metadata
          mkdir -p release-metadata
          for attempt in 1 2 3; do
            rm -rf release-metadata/sidecars
            mkdir -p release-metadata/sidecars
            if timeout 60s gh release download \
              "$tag" \
              --dir release-metadata/sidecars \
              --pattern '*.sha256'
            then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Unable to download release checksum sidecars after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$attempt"
          done
          timeout 30s gh release view "$tag" --json assets > release-metadata/assets.json
          .github/scripts/release/metadata/render-release-checksums.py \
            --tag "$tag" \
            --provenance dist/build-provenance.json \
            --assets release-metadata/assets.json \
            --sidecars release-metadata/sidecars \
            --output dist/SHA256SUMS

      - name: Retain release metadata
        uses: actions/upload-artifact@v6
        with:
          name: release-metadata-${{ github.run_id }}
          path: |
            dist/build-provenance.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30


  publish-release:
    name: Publish release
    needs:
      - prepare-release
      - build-release-metadata
    if: always() && needs.prepare-release.result == 'success' && needs.build-release-metadata.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Download retained release metadata
        uses: actions/download-artifact@v7
        with:
          name: release-metadata-${{ github.run_id }}
          path: dist

      - name: Upload retained release metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare-release.outputs.release_tag }}"
          for asset in dist/build-provenance.json dist/SHA256SUMS; do
            .github/scripts/release/upload-immutable-release-asset.sh \
              --tag "$tag" \
              --asset "$asset"
          done

      - name: Publish draft release with provenance annotation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare-release.outputs.release_tag }}"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          release_flags=("--draft=false")
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          provenance_marker="**Build provenance:** [CI Run #${{ github.run_number }}]($run_url)"
          release_body="$(timeout 30s gh release view "$tag" --json body -q .body)"
          release_notes="$release_body"
          if [[ "$release_body" != *"$provenance_marker"* ]]; then
            release_notes="${release_body}

          ---
          ${provenance_marker}"
          fi
          timeout 30s gh release edit "$tag" "${release_flags[@]}" \
            --notes "$release_notes"

  verify-release-state:
    name: Verify published release state
    needs:
      - prepare-release
      - publish-release
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Verify published release state
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.publish-release.result }}" != "success" ]]; then
            echo "::error::Publish release finished with result ${{ needs.publish-release.result }}."
            exit 1
          fi
          scripts/release/verify-release-state.sh \
            --tag "${{ needs.prepare-release.outputs.release_tag }}" \
            --repository "${{ github.repository }}"
