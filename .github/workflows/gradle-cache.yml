name: Populate Gradle caches

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KAST_SEMANTIC_FIXTURES: ${{ vars.KAST_SEMANTIC_FIXTURES || 'false' }}

concurrency:
  group: gradle-cache-main
  cancel-in-progress: false

jobs:
  source-work:
    name: Populate Linux source cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        id: jdk25
        with:
          distribution: graalvm
          java-version: 25.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt uv==0.12.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-cleanup: on-success
          gradle-home-cache-includes: |
            caches
            notifications
            native-build-tools
            kast/topology-intellij-kotlin-plugin
      - name: Populate source task outputs
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
        run: python3 .github/scripts/ci/source_validation.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cache-source-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Populate macOS adapter cache
    if: github.ref == 'refs/heads/main' && vars.KAST_NATIVE_COMPILATION != 'false'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: 25.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python3 -m pip install uv==0.12.9
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-cleanup: on-success
      - name: Populate adapter task outputs
        run: >-
          ./gradlew :distribution:cli:test
          --tests '*NativeResetListenerTest'
          --tests '*NativeResetPeerAcceptanceTest'
          --tests '*ResetLaunchObservationTest'
          --console=plain
