name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - ".github/scripts/docs/render-rpc-contract-summary.py"
      - ".github/scripts/docs/test-docs-navigation-contract.sh"
      - ".github/scripts/docs/test-docs-content-contract.sh"
      - ".github/scripts/docs/test-likec4-contract.sh"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "packaging/indexer/**"
      - "cli-rs/protocol/**"
      - "requirements-docs.txt"
      - "zensical.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - ".github/scripts/docs/render-rpc-contract-summary.py"
      - ".github/scripts/docs/test-docs-navigation-contract.sh"
      - ".github/scripts/docs/test-docs-content-contract.sh"
      - ".github/scripts/docs/test-likec4-contract.sh"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "packaging/indexer/**"
      - "cli-rs/protocol/**"
      - "requirements-docs.txt"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz
          command -v dot
          command -v unflatten
      - run: npm ci
      - run: echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-docs.txt
      - run: ./.github/scripts/docs/test-likec4-contract.sh
      - run: npm run diagrams:validate
      - run: npm run diagrams:embed
      - run: ./.github/scripts/docs/test-docs-navigation-contract.sh
      - run: ./.github/scripts/docs/test-docs-content-contract.sh
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
