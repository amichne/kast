name: Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact published preview tag (developer-v0.0.RUN)
        required: true
        type: string
      record_sha256:
        description: SHA-256 of that immutable build-record.json
        required: true
        type: string
      public_version:
        description: Public semantic version to map to the retained build
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Promote retained preview bytes without building
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      RECORD_SHA256: ${{ inputs.record_sha256 }}
      PUBLIC_VERSION: ${{ inputs.public_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Ubuntu 24.04 supplies Python 3.12. Promotion resolves no tool or product dependencies.
      - name: Admit published inventory and promote identical archives
        run: >-
          python3 .github/scripts/release/publish_developer.py stable
          --source-tag "$SOURCE_TAG"
          --record-sha256 "$RECORD_SHA256"
          --public-version "$PUBLIC_VERSION"
