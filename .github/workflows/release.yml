name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Prove exact assets, then publish
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Detach exact release source
        run: git checkout --detach "$GITHUB_SHA"

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/tooling/likec4/package-lock.json

      - name: Install documentation validator
        run: npm install --global mint@4.2.841

      - name: Build and verify release assets
        run: >-
          bash .github/scripts/release/build-assets.sh
          --version "$RELEASE_VERSION"
          --source-revision "$GITHUB_SHA"

      - name: Attest verified candidate assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: build/release/v${{ inputs.version }}/*

      - name: Publish immutable GitHub release
        run: >-
          bash .github/scripts/release/publish-release.sh
          --release "v${RELEASE_VERSION}"
          --commit "$GITHUB_SHA"
          --assets-directory "build/release/v${RELEASE_VERSION}"
