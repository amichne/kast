name: CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
      product: ${{ steps.scope.outputs.product }}
      portable: ${{ steps.scope.outputs.portable }}
      documentation: ${{ steps.scope.outputs.documentation }}
      gate_graph: ${{ steps.scope.outputs.gate_graph }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test CI decisions
        run: |
          python3 .github/scripts/ci/test_validation_scope.py
          python3 .github/scripts/ci/test_source_validation.py
          python3 .github/scripts/ci/test_routine_gate.py
          python3 .github/scripts/ci/test_required_checks.py
          python3 .github/scripts/ci/test_validation_outcome.py
          python3 .github/scripts/ci/test_verify_documentation.py
          python3 .github/scripts/ci/test_verify_checks.py
          python3 .github/scripts/release/test_build_candidate.py

      - name: Select checks
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/ci/validation_scope.py \
            --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" \
            --head "$CHECKOUT_SHA" --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  documentation:
    needs: scope
    if: needs.scope.outputs.documentation == 'run'
    uses: ./.github/workflows/docs.yml

  portable:
    needs: scope
    if: needs.scope.outputs.portable == 'run'
    name: Offline packaging in disposable container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run offline packaging suites
        run: ./packaging/run-portable-tests-container.sh

  source:
    needs: scope
    if: needs.scope.outputs.source == 'run'
    name: Source validation
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up GraalVM Java 25
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: 25.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol and semantic test tools
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt uv==0.12.9

      - name: Set up documentation parser runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Main entries are visible to other PRs; PR-scoped writes cannot warm them.
          # A main workflow_dispatch performs a full build to seed/refresh these entries.
          cache-read-only: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
          cache-cleanup: on-success
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          # Cacheable IDEA extraction tasks restore their outputs from that cache. Cache the non-cacheable topology Sync separately.
          gradle-home-cache-includes: |
            caches
            notifications
            native-build-tools
            kast/topology-intellij-kotlin-plugin

      - name: Validate complete source population
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
        run: python3 .github/scripts/ci/source_validation.py

      - name: Retain source evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-source-reports-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: error
          retention-days: 14

  kotlin:
    needs: scope
    if: needs.scope.outputs.product == 'run'
    name: Kotlin product
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reuse tested merged PR candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release/build_candidate.py reuse
          --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"
          --bundle build/candidate --github-output "$GITHUB_OUTPUT"

      - name: Set up GraalVM Java 25
        if: steps.reuse.outputs.candidate != 'REUSED'
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: 25.0.2

      - name: Set up Python
        if: steps.reuse.outputs.candidate != 'REUSED'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol and semantic test tools
        if: steps.reuse.outputs.candidate != 'REUSED'
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt uv==0.12.9

      - name: Set up documentation parser runtime
        if: steps.reuse.outputs.candidate != 'REUSED'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Set up Gradle
        if: steps.reuse.outputs.candidate != 'REUSED'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Main entries are visible to other PRs; PR-scoped writes cannot warm them.
          # A main workflow_dispatch performs a full build to seed/refresh these entries.
          cache-read-only: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
          cache-cleanup: on-success
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          # Cacheable IDEA extraction tasks restore their outputs from that cache. Cache the non-cacheable topology Sync separately.
          gradle-home-cache-includes: |
            caches
            notifications
            native-build-tools
            kast/topology-intellij-kotlin-plugin

      - name: Run candidate preflight
        if: steps.reuse.outputs.candidate != 'REUSED'
        env:
          GH_TOKEN: ${{ github.token }}
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          GATE_GRAPH: ${{ needs.scope.outputs.gate_graph }}
        run: python3 .github/scripts/ci/verify-checks.py --preflight-only --gate-graph "$GATE_GRAPH"

      - name: Build and test one immutable candidate
        if: steps.reuse.outputs.candidate != 'REUSED'
        env:
          GH_TOKEN: ${{ github.token }}
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
        run: bash .github/scripts/ci/verify.sh --version "0.0.$GITHUB_RUN_NUMBER"

      - name: Seal tested candidate identity
        if: steps.reuse.outputs.candidate != 'REUSED'
        env:
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/release/build_candidate.py seal
          --repository "$GITHUB_REPOSITORY" --revision "$CHECKOUT_SHA"
          --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --event "$GITHUB_EVENT_NAME" --bundle build/candidate

      - name: Retain immutable build candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-build-candidate-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: build/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-reports-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  source-feedback:
    name: Source feedback
    needs: [scope, source, documentation, portable]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require source obligations
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py --source-feedback

  required:
    name: CI required checks
    needs: [scope, source, documentation, portable, kotlin]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py

      - name: Seal successful validation outcome
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci/validation_outcome.py --record build/validation/validation.json

      - name: Retain exact validation outcome
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-validation-outcome-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: build/validation/validation.json
          if-no-files-found: error
          retention-days: 30
