name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.scope.outputs.product }}
      portable: ${{ steps.scope.outputs.portable }}
      documentation: ${{ steps.scope.outputs.documentation }}
      gate_graph: ${{ steps.scope.outputs.gate_graph }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test CI decisions
        run: |
          python3 .github/scripts/ci/test_validation_scope.py
          python3 .github/scripts/ci/test_required_checks.py
          python3 .github/scripts/ci/test_verify_checks.py

      - name: Select checks
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/ci/validation_scope.py \
            --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" \
            --head "$CHECKOUT_SHA" --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  documentation:
    needs: scope
    if: needs.scope.outputs.documentation == 'run'
    uses: ./.github/workflows/docs.yml

  portable:
    needs: scope
    if: needs.scope.outputs.portable == 'run'
    name: Offline packaging in disposable container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run offline packaging suites
        run: ./packaging/run-portable-tests-container.sh

  kotlin:
    needs: scope
    if: needs.scope.outputs.product == 'run'
    name: Kotlin product
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up GraalVM Java 25
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol test dependencies
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true
          # Save task outputs for later runs of this PR; fork PRs only restore trusted caches.
          cache-read-only: ${{ !((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main') }}
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          gradle-home-cache-includes: |
            caches
            notifications
            kast/workspace-intellij-read-idea-distributions
            kast/symbol-intellij-idea-distributions
            kast/topology-intellij-kotlin-plugin

      - name: Resolve next patch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: candidate_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 distribution/release/resolve_version.py
          --repository "$GITHUB_REPOSITORY"
          --bump patch

      - name: Build and verify product
        env:
          GH_TOKEN: ${{ github.token }}
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_GRAPH: ${{ needs.scope.outputs.gate_graph }}
        run: |
          git checkout --detach "$CANDIDATE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            python3 .github/scripts/ci/verify-checks.py --gate-graph "$GATE_GRAPH" --preflight-only
          else
            python3 .github/scripts/ci/verify-checks.py --gate-graph "$GATE_GRAPH"
          fi

      - name: Build exact patch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          RELEASE_VERSION: ${{ steps.candidate_version.outputs.version }}
        run: bash .github/scripts/ci/verify.sh --version "$RELEASE_VERSION"

      - name: Admit exact patch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: ${{ steps.candidate_version.outputs.version }}
        run: >-
          python3 .github/scripts/release/ci-candidate.py validate
          --repository "$GITHUB_REPOSITORY"
          --version "$RELEASE_VERSION"
          --source-revision "$GITHUB_SHA"
          --directory "build/release/v${RELEASE_VERSION}"

      - name: Retain exact patch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-release-candidate-v${{ steps.candidate_version.outputs.version }}-${{ github.sha }}
          path: build/release/v${{ steps.candidate_version.outputs.version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: CI required checks
    needs: [scope, documentation, portable, kotlin]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py
