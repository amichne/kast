name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin product
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        id: jdk25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol test dependencies
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-includes: |
            caches
            notifications
            kast/indexer-idea-distributions

      - name: Build and verify product
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git checkout --detach "$CANDIDATE_SHA"
          python3 .github/scripts/ci/verify-checks.py

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
