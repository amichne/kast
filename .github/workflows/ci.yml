name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      rollout:
        description: Frozen CI corpus phase
        type: choice
        default: none
        options: [none, warm, changed, reuse, cold]
      rollout_case:
        description: Frozen case to measure through its own aggregate
        type: choice
        default: all
        options: [all, documentation, leaf-service, semantic-adapter, shared-contract]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KAST_SEMANTIC_FIXTURES: ${{ vars.KAST_SEMANTIC_FIXTURES || 'false' }}
  KAST_MACOS_CHECKS: ${{ vars.KAST_MACOS_CHECKS || 'false' }}
  KAST_NATIVE_COMPILATION: ${{ vars.KAST_MACOS_CHECKS == 'true' && (vars.KAST_NATIVE_COMPILATION || 'true') || 'false' }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.rollout_case && inputs.rollout_case != 'all' && format('-{0}', inputs.rollout_case) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
      product: ${{ steps.scope.outputs.product }}
      portable: ${{ steps.scope.outputs.portable }}
      documentation: ${{ steps.scope.outputs.documentation }}
      scope: ${{ steps.scope.outputs.scope }}
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        run: python3 -m pip install --disable-pip-version-check uv==0.12.9

      - name: Test CI decisions
        run: |
          echo "Semantic fixture switch: $KAST_SEMANTIC_FIXTURES" >> "$GITHUB_STEP_SUMMARY"
          echo "macOS check switch: $KAST_MACOS_CHECKS; effective product assembly: $KAST_NATIVE_COMPILATION" >> "$GITHUB_STEP_SUMMARY"
          uv run --locked --script .github/scripts/ci/fast_checks.py decisions

      - name: Select checks
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/ci/validation_scope.py \
            --affected \
            --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" \
            --head "$CHECKOUT_SHA" --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  documentation:
    needs: scope
    if: needs.scope.outputs.documentation == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  portable:
    needs: scope
    if: needs.scope.outputs.portable == 'run'
    name: Offline packaging in disposable container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run offline packaging suites
        run: ./packaging/internal/verification/run-portable-tests-container.sh

  source-work:
    needs: scope
    if: needs.scope.outputs.source == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    name: Source obligations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.scope.outputs.product == 'run' && github.sha || github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/source-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        env:
          # Shared with gradle-cache.yml so a dispatched seed is this job's newest entry.
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: source-work
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: linux-source
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Every trusted run writes. Main entries serve all refs; PR entries serve later pushes to that PR.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-cleanup: on-success
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          # IDEA library transform outputs also live under caches.
          gradle-home-cache-includes: |
            caches
            notifications

      - name: Scan the frontend against the Go advisory database
        run: uv run --locked --script frontend/check vulnerabilities

      - name: Validate affected source obligations
        if: needs.scope.outputs.product == 'skip'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_VERIFICATION_PLAN: ${{ needs.scope.outputs.plan }}
        run: python3 .github/scripts/ci/source_validation.py --affected --base "$BASE_SHA" --event "$GITHUB_EVENT_NAME"

      - name: Validate complete candidate source obligations
        if: needs.scope.outputs.product == 'run'
        run: python3 .github/scripts/ci/source_validation.py

      - name: Retain source evidence
        if: always() && (inputs.rollout == '' || inputs.rollout == 'none')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-source-reports-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: error
          retention-days: 14

  # The Control executable cross-compiles and its JVM payload is portable, so Linux assembles the macOS release.
  assembly:
    name: Assemble release on Linux
    needs: scope
    if: vars.KAST_MACOS_CHECKS == 'true' && needs.scope.outputs.product == 'run'
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Check workspace and scratch free space
        run: python3 .github/scripts/ci/build_storage.py check --minimum-bytes 8589934592 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python3 -m pip install uv==0.12.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Set up the frontend Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: frontend/go.mod
          cache-dependency-path: frontend/go.sum
      - name: Assemble the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --script .github/scripts/ci/release_handoff.py assemble --version "0.0.$GITHUB_RUN_NUMBER"
      - id: handoff
        uses: actions/upload-artifact@v7.0.2
        with:
          name: assembled-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-output/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: assembly-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  # Observe the Mac when the product job becomes ready.
  kotlin-runner:
    name: Select macOS product runner
    needs: [scope, assembly]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.select.outputs.labels || '"macos-15"' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: select
        if: github.ref == 'refs/heads/main'
        env:
          KAST_PREFER_LOCAL_MAC: ${{ vars.KAST_PREFER_LOCAL_MAC }}
          KAST_RUNNER_STATUS_TOKEN: ${{ secrets.KAST_RUNNER_STATUS_TOKEN }}
        run: python3 .github/scripts/ci/mac_runner.py

  kotlin:
    name: Kotlin product
    # Runs beside source-work; the required job still demands its source proof.
    needs: [scope, assembly, kotlin-runner]
    if: always() && vars.KAST_MACOS_CHECKS == 'true' && needs.scope.outputs.product == 'run' && needs.assembly.result == 'success' && needs.kotlin-runner.result == 'success' && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ${{ fromJSON(needs.kotlin-runner.outputs.labels) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment != 'self-hosted'
        with:
          python-version-file: .python-version
      - run: python3 -m pip install uv==0.12.9
        if: runner.environment != 'self-hosted'
      - name: Set up local Python
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/local-python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.assembly.outputs.artifact_id || '0' }}
          merge-multiple: true
          path: build/handoff-input/
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          # The local runner keeps its own Gradle home and never writes hosted caches.
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Exercise macOS reset adapters
        run: uv run --locked --script .github/scripts/ci/macos_reset_checks.py
      - uses: ./.github/actions/jq-oracle
      - name: Exercise the exact assembled Mac Control product
        run: uv run --locked --script .github/scripts/ci/release_handoff.py qualify --version "0.0.$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: macos-query-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/publicLauncherTest/
            build/reports/tests/publicLauncherTest/
            build/reports/native/reset-checks/
            distribution/cli/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  composed-macos:
    name: macOS complete-product qualification
    # Qualification runs beside source-work; sealed-product requires the source proof.
    needs: [scope, assembly]
    if: >-
      !cancelled() &&
      needs.assembly.result == 'success' &&
      needs.scope.outputs.product == 'run' && vars.KAST_MACOS_CHECKS == 'true' &&
      vars.KAST_NATIVE_COMPILATION != 'false' &&
      (inputs.rollout == '' || inputs.rollout == 'none')
    uses: ./.github/workflows/composed-linux.yml
    with:
      version: 0.0.${{ github.run_number }}
      complete_product: true
      release_target: macos-aarch64
      assembled_artifact_id: ${{ needs.assembly.outputs.artifact_id }}

  sealed-product:
    name: Seal the qualified Mac product
    needs: [scope, source-work, composed-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kast-qualified-product-macos-aarch64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/product-inputs/macos-aarch64
      - name: Seal the complete immutable build record
        run: >-
          python3 .github/scripts/release/product_producer.py seal --macos-only
          --directory build/product-inputs --output build/product-candidate
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-product-sealed-${{ github.sha }}-${{ github.run_attempt }}
          path: build/product-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  installed-product:
    name: Installed product acceptance on ${{ matrix.target }}
    needs: sealed-product
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-sealed-${{ github.sha }}-${{ github.run_attempt }}
          path: build/product-candidate
      - name: Require an explicit component-qualified baseline
        env:
          BASELINE_RUN_ID: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ID }}
          BASELINE_RUN_ATTEMPT: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ATTEMPT }}
          BASELINE_REVISION: ${{ vars.KAST_ACCEPTANCE_BASELINE_REVISION }}
          BASELINE_RECORD_SHA256: ${{ vars.KAST_ACCEPTANCE_BASELINE_RECORD_SHA256 }}
        run: |
          test -n "$BASELINE_RUN_ID" && test -n "$BASELINE_RUN_ATTEMPT" && test -n "$BASELINE_REVISION" && test -n "$BASELINE_RECORD_SHA256" || {
            echo 'Unmet input: explicit different component-qualified baseline required; repair is not upgrade' >&2
            exit 1
          }
      # Schema-2 baselines qualify only with their detached acceptance receipts, which
      # exist in the joined candidate. Legacy baselines predate that artifact; admission
      # below still rejects a schema-2 sealed record that lacks acceptance.
      - name: Download the accepted baseline candidate
        id: accepted-baseline
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-candidate-${{ vars.KAST_ACCEPTANCE_BASELINE_REVISION }}-${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ATTEMPT }}
          run-id: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ID }}
          github-token: ${{ github.token }}
          path: build/product-baseline
      - name: Download the legacy sealed baseline
        if: steps.accepted-baseline.outcome != 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-sealed-${{ vars.KAST_ACCEPTANCE_BASELINE_REVISION }}-${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ATTEMPT }}
          run-id: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ID }}
          github-token: ${{ github.token }}
          path: build/product-baseline
      - name: Admit exact sealed baseline provenance and pinned interpreter inputs
        env:
          BASELINE_RUN_ID: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ID }}
          BASELINE_RUN_ATTEMPT: ${{ vars.KAST_ACCEPTANCE_BASELINE_RUN_ATTEMPT }}
          BASELINE_REVISION: ${{ vars.KAST_ACCEPTANCE_BASELINE_REVISION }}
          BASELINE_RECORD_SHA256: ${{ vars.KAST_ACCEPTANCE_BASELINE_RECORD_SHA256 }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          PYTHONPATH=.github/scripts/release:packaging/internal/bootstrap:packaging python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          import product_candidate
          from private_interpreter import PINS, DEPENDENCY_URL, PrivateInterpreter
          producer = product_candidate.product.ProductProducer(int(os.environ['BASELINE_RUN_ID']), int(os.environ['BASELINE_RUN_ATTEMPT']), '.github/workflows/ci.yml')
          route = f'repos/amichne/kast/actions/runs/{producer.runId}/attempts/{producer.runAttempt}/jobs?per_page=100'
          jobs = product_candidate.product.document(subprocess.run(['gh', 'api', route], check=True, capture_output=True, timeout=30).stdout)
          baseline = product_candidate.admit_baseline(Path('build/product-baseline'), os.environ['BASELINE_RECORD_SHA256'], os.environ['BASELINE_REVISION'], producer, product_candidate.observe(producer), jobs)
          source = product_candidate.product.HttpReleaseSource()
          if isinstance(baseline, product_candidate.candidate.Failure):
              raise SystemExit(f'Unmet baseline input: {baseline.value}')
          pin = next(item for item in PINS if item.target == os.environ['TARGET'])
          for url, name, limit in ((pin.url, 'private-python.tar.gz', 268435456), (DEPENDENCY_URL, 'defusedxml.whl', 1048576)):
              result = source.download(url, Path('build') / name, limit)
              if isinstance(result, product_candidate.product.TRANSFER_REJECTIONS):
                  raise SystemExit(product_candidate.product.transfer(result).cause.value)
          PrivateInterpreter.admit(Path('build/private-python.tar.gz'), Path('build/defusedxml.whl'), pin.target)
          PY
      - name: Exercise installed CLI MCP RPC and lifecycle against retained bytes
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          mise exec -- uv run --locked --project packaging python packaging/internal/verification/product_lifecycle_probe.py
          --candidate build/product-candidate --baseline build/product-baseline
          --target "$TARGET" --private-python-archive build/private-python.tar.gz
          --private-dependency build/defusedxml.whl --evidence build/installed-evidence
          --receipt "build/acceptance-${TARGET}.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: kast-installed-product-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/acceptance-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: kast-installed-evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/installed-evidence/
          if-no-files-found: warn
          retention-days: 14

  complete-product:
    name: Join installed acceptance without rewriting the build record
    needs: [sealed-product, installed-product]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-sealed-${{ github.sha }}-${{ github.run_attempt }}
          path: build/product-sealed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kast-installed-product-macos-aarch64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/product-acceptance
      - run: >-
          python3 .github/scripts/release/product_producer.py accept
          --directory build/product-sealed --receipt build/product-acceptance --output build/product-candidate
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-product-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: build/product-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  source:
    name: Source validation
    needs: [scope, source-work]
    if: always() && needs.scope.outputs.source == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require the selected source-proof producer
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py --source-proof

  source-feedback:
    name: Source feedback
    needs: [scope, source, documentation, portable]
    if: always() && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require source obligations
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py --source-feedback

  required:
    name: CI required checks
    needs: [scope, source, documentation, portable, kotlin, complete-product]
    if: always() && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci/required_checks.py

      - name: Require Mac installed acceptance for the selected product gate
        if: needs.scope.outputs.product == 'run'
        env:
          COMPLETE_PRODUCT_RESULT: ${{ needs.complete-product.result }}
        run: test "$COMPLETE_PRODUCT_RESULT" = success

      - name: Seal successful validation outcome
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci/validation_outcome.py --affected --record build/validation/validation.json

      - name: Retain exact validation outcome
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-validation-outcome-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: build/validation/validation.json
          if-no-files-found: error
          retention-days: 30

  rollout:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.rollout != 'none'
    name: Frozen rollout (${{ matrix.case }}, ${{ inputs.rollout }})
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.rollout_case == 'all' && '["documentation","leaf-service","semantic-adapter","shared-contract"]' || format('["{0}"]', inputs.rollout_case)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        id: jdk25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: ${{ inputs.rollout != 'cold' && 'pip' || '' }}
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol and semantic test tools
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt uv==0.12.9

      - uses: ./.github/actions/jq-oracle

      - name: Set up the frontend Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: frontend/go.mod
          cache-dependency-path: frontend/go.sum

      - name: Set up documentation parser runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          cache-disabled: ${{ inputs.rollout == 'cold' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Only the explicit rollout warm-up writes this branch-scoped cache.
          # Routine PR policy remains read-only.
          cache-read-only: ${{ inputs.rollout != 'warm' }}
          cache-cleanup: on-success
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          # IDEA library transform outputs also live under caches.
          gradle-home-cache-includes: |
            caches
            notifications

      - name: Replay frozen change
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          ROLLOUT_CASE: ${{ matrix.case }}
          ROLLOUT_MODE: ${{ inputs.rollout }}
        run: python3 .github/scripts/ci/rollout.py --case "$ROLLOUT_CASE" --mode "$ROLLOUT_MODE"

      - name: Retain source evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-rollout-${{ matrix.case }}-${{ inputs.rollout }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: error
          retention-days: 14

  rollout-feedback:
    name: Frozen rollout feedback
    needs: [scope, rollout, portable]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.rollout != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Require every corpus result and portable checks
        env:
          ROLLOUT_SUCCESS: ${{ needs.scope.result == 'success' && needs.rollout.result == 'success' && needs.portable.result == 'success' }}
        run: test "$ROLLOUT_SUCCESS" = true
