name: Agent source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply staged agent patch
        run: |
          patch_file="$(find scripts -maxdepth 1 -name 'agent-*.patch.gz.b64' -print -quit)"
          if [ -n "$patch_file" ]; then
            base64 --decode "$patch_file" | gunzip > /tmp/agent.patch
            git apply --check /tmp/agent.patch
            git apply /tmp/agent.patch
            rm "$patch_file"
            git config user.name "OpenAI Codex"
            git config user.email "codex@openai.com"
            git add --all
            git commit -m "test: define public surface regression proofs"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Package tracked source
        run: git archive --format=tar.gz --output=/tmp/kast-source.tar.gz HEAD

      - name: Upload tracked source
        uses: actions/upload-artifact@v4
        with:
          name: kast-source-${{ github.sha }}
          path: /tmp/kast-source.tar.gz
          if-no-files-found: error
          retention-days: 1
