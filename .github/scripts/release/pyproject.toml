[project]
name = "kast-developer-publication"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.0", "pyright[nodejs]==1.1.407", "pytest==9.0.3"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["developer_catalog.py", "publish_developer.py", "test_developer_catalog.py", "test_developer_publication.py", "host_targets.py", "dual_candidate.py", "host_evidence.py", "host_staging.py", "installed_target_evidence.py", "test_installed_target_evidence.py", "host_target_validation.py", "test_host_staging.py", "test_host_target_validation.py", "test_dual_candidate.py", "test_dual_producer.py", "test_dual_publication.py", "test_host_evidence.py", "dual_catalog.py", "test_dual_catalog.py", "generate_host_target_receipt.py", "test_generate_host_target_receipt.py"]
extraPaths = ["../ci", "../../../packaging", "../../../distribution/release"]
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["**/developer_catalog.py", "**/publish_developer.py", "**/test_developer_catalog.py", "**/test_developer_publication.py", "**/host_targets.py", "**/dual_candidate.py", "**/host_evidence.py", "**/host_staging.py", "**/installed_target_evidence.py", "**/test_installed_target_evidence.py", "**/host_target_validation.py", "**/test_host_staging.py", "**/test_host_target_validation.py", "**/test_dual_candidate.py", "**/test_dual_producer.py", "**/test_dual_publication.py", "**/test_host_evidence.py", "**/dual_catalog.py", "**/test_dual_catalog.py", "**/generate_host_target_receipt.py", "**/test_generate_host_target_receipt.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
pythonpath = [".", "../ci"]
testpaths = ["."]
python_files = ["test_*.py"]
