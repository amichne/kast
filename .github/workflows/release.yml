name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Admit exact main release source
        run: |
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "release: dispatch SHA $GITHUB_SHA is not current main $main_sha" >&2
            exit 1
          fi
          git checkout --detach "$GITHUB_SHA"

      - name: Set up Java 25
        id: jdk25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: experiments/host-observation/requirements-test.txt

      - name: Install host protocol test dependencies
        run: python3 -m pip install --disable-pip-version-check -r experiments/host-observation/requirements-test.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true
          gradle-home-cache-includes: |
            caches
            notifications
            kast/indexer-idea-distributions

      - name: Resolve release version
        id: release_version
        run: >-
          python3 distribution/release/resolve_version.py
          --repository "$GITHUB_REPOSITORY"
          --bump "${{ inputs.bump }}"

      - name: Build exact release candidate
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: bash .github/scripts/ci/verify.sh --version "$RELEASE_VERSION"

      - name: Publish immutable GitHub release
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: >-
          bash .github/scripts/release/publish-release.sh
          --release "v${RELEASE_VERSION}"
          --commit "$GITHUB_SHA"
          --assets-directory "build/release/v${RELEASE_VERSION}"
