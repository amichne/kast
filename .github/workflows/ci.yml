name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify installer recovery flow
        run: bash packaging/test-installer.sh

  kotlin:
    name: Kotlin product
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        id: jdk25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-includes: |
            caches
            notifications
            kast/indexer-idea-distributions

      - name: Build and verify product
        if: github.event_name != 'workflow_dispatch'
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git checkout --detach "$CANDIDATE_SHA"
          python3 .github/scripts/ci/verify-checks.py

      - name: Build exact release candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git checkout --detach "$CANDIDATE_SHA"
          bash .github/scripts/ci/verify.sh

      - name: Retain release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain routine verification reports
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
