[project]
name = "kast-managed-installation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "defusedxml==0.7.1",
    "pyyaml==6.0.3",
    "types-defusedxml==0.7.0.20260504",
    "types-PyYAML==6.0.12.20250915",
]

[dependency-groups]
dev = ["ruff==0.14.0", "pyright[nodejs]==1.1.407", "pytest==9.0.3"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["../bin/kast-container", "dev_container.py", "container_compile.py", "container_install.py", "test_dev_container.py", "test_dev_container_simulation.py", "test_composition_platform.py", "../bin/kast-task-vm", "task_vm.py", "task_vm_guest.py", "test_composition_task_vm.py", "../bin/setup-kast", "composition_platform.py", "composed_bundle.py", "test_composition_bundle.py", "composed_host_probe.py", "test_composition_descriptors.py", "test_composition_host.py", "composed_host.py", "composition_descriptors.py", "composition_recipe.py", "composition_index.py", "test_composition_index.py", "composition_graph.py", "test_composition_graph.py", "managed_headless.py", "test-managed-headless.py", "managed_installation.py", "managed_release.py", "managed_update_journal.py", "managed_update_contract.py", "test-managed-installation.py", "test-managed-release.py", "test-managed-update-contract.py", "oci_task.py", "test_composition_oci_task.py", "composed_oci.py", "test_composition_oci.py", "composed_release.py", "test_composition_release.py"]
extraPaths = ["."]
reportUnusedCallResult = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["../bin/kast-container", "**/dev_container.py", "**/container_compile.py", "**/container_install.py", "**/test_dev_container.py", "**/test_dev_container_simulation.py", "**/test_composition_platform.py", "../bin/kast-task-vm", "**/task_vm.py", "**/task_vm_guest.py", "**/test_composition_task_vm.py", "../bin/setup-kast", "**/composition_platform.py", "**/composed_bundle.py", "**/test_composition_bundle.py", "**/composed_host_probe.py", "**/test_composition_descriptors.py", "**/test_composition_host.py", "**/composed_host.py", "**/composition_descriptors.py", "**/composition_recipe.py", "**/composition_index.py", "**/test_composition_index.py", "**/composition_graph.py", "**/test_composition_graph.py", "**/managed_headless.py", "**/test-managed-headless.py", "**/managed_installation.py", "**/managed_release.py", "**/managed_update_journal.py", "**/managed_update_contract.py", "**/test-managed-installation.py", "**/test-managed-release.py", "**/test-managed-update-contract.py", "**/oci_task.py", "**/test_composition_oci_task.py", "**/composed_oci.py", "**/test_composition_oci.py", "**/composed_release.py", "**/test_composition_release.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.per-file-target-version]
"managed_update_journal.py" = "py39"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
pythonpath = ["."]
python_files = ["test-managed-*.py", "test_composition_*.py"]
testpaths = ["."]
