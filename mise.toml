[tools]
uv = "0.12.9"
java = "temurin-25.0.4+7.0.LTS"
node = "24.21.0"
vale = "3.24.0"
jq = "1.8.2"
go = "1.27.4"

[env]
_.path = ["{{config_root}}/bin"]

[task_config]
includes = ["config/ci/tasks/dev.toml", "config/ci/tasks/release.toml", "config/ci/tasks/ci.toml", "config/ci/tasks/docs.toml", "config/ci/tasks/composed.toml"]

# CI installs the tools each job needs. Running a task must not fetch unrelated tools.
[settings]
task.run_auto_install = false

# A workflow with fixed inputs rejects extra arguments before its first step.
[task_templates.fixed]
usage = 'arg "[unused]" var=#true var_max=0'
