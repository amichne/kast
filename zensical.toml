[project]
site_name = "Kast"
site_description = "Compiler-grounded answers to Kotlin repository questions."
site_author = "amichne"
site_url = "https://kast.michne.com/"
repo_url = "https://github.com/amichne/kast"
repo_name = "amichne/kast"
edit_uri = "edit/main/docs/public"
docs_dir = "docs/public"
site_dir = "site"
copyright = "Copyright &copy; 2026 amichne"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Start" = "index.md" },
  { "Repository questions" = [
    { "What declaration does this refer to?" = "questions/resolve-declaration.md" },
    { "What depends on this API?" = "questions/dependents.md" },
    { "Where can this value flow?" = "questions/value-flow.md" },
    { "What changes with this contract?" = "questions/contract-change.md" },
    { "Did the change reach every dependency?" = "questions/verify-coverage.md" },
  ] },
  { "Trust the evidence" = "concepts/evidence-boundaries.md" },
  { "CLI contract" = "reference/cli.md" },
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/network"
repo = "fontawesome/brands/github"
edit = "material/file-edit-outline"
view = "material/file-eye-outline"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = false
unresolved_footnotes = false
unused_definitions = false
unused_footnotes = false
shadowed_definitions = false
shadowed_footnotes = false
