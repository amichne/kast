name: Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Mintlify site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install locked documentation runner
        run: python3 -m pip install --disable-pip-version-check uv==0.12.9

      - name: Install declared tools and separate reader Vale
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: java node vale@3.24.0 vale@3.25.1

      # The knowledge tasks below run Gradle. Restored plugins and dependencies
      # keep a registry outage from failing an unchanged documentation contract.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-cleanup: on-success

      - name: Verify parser and glossary contracts
        run: mise run docs:contracts

      - name: Install locked Mintlify CLI
        run: mise run docs:mintlify-install

      - name: Verify validator network handling
        run: mise run docs:mintlify-runtime

      - name: Validate Mintlify build
        run: mise run docs:mintlify-validate

      - name: Examine Mintlify links
        run: mise run docs:mintlify-links

      - name: Select rendered reader path check
        id: reader-path
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: mise run docs:reader-path

      - name: Click through Get started on desktop and mobile
        if: steps.reader-path.outputs.run == 'true'
        run: mise run docs:reader-journey

      - name: Assess prose and contract evidence
        id: prose
        run: mise run docs:prose

      - name: Keep documentation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/reports/documentation/
          if-no-files-found: error
