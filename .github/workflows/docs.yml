name: Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Mintlify site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install locked documentation runner
        run: python3 -m pip install --disable-pip-version-check uv==0.12.9

      - name: Install declared tools and separate reader Vale
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: java node vale@3.24.0 vale@3.25.1

      - name: Verify parser and glossary contracts
        run: python3 .github/scripts/ci/verify_documentation.py

      - name: Install locked Mintlify CLI
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/kast-mint-user.npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/kast-mint-global.npmrc
          NPM_CONFIG_CACHE: ${{ runner.temp }}/kast-mint-npm-cache
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          : > "$NPM_CONFIG_GLOBALCONFIG"
          npm ci --prefix .github/tools/mintlify --ignore-scripts --no-audit --no-fund

      - name: Verify validator network handling
        run: node --test .github/tools/mintlify/test-runtime.mjs

      - name: Validate Mintlify build
        working-directory: docs/public
        run: '"${{ github.workspace }}/.github/tools/mintlify/node_modules/.bin/mint" validate'

      - name: Examine Mintlify links
        working-directory: docs/public
        run: '"${{ github.workspace }}/.github/tools/mintlify/node_modules/.bin/mint" broken-links'

      - name: Assess prose and contract evidence
        id: prose
        continue-on-error: true
        run: >-
          uv run --locked --project docs/tooling python docs/tooling/prose_assessment.py
          --vale-bin "$(mise where vale@3.24.0)/vale"
          --reader-vale-bin "$(mise where vale@3.25.1)/vale"
          --dispositions docs/reviews/documentation-migration/prose-dispositions.json
          --report build/reports/documentation/prose/receipt.json

      - name: Install locked rendered runner
        run: npm ci --ignore-scripts --engine-strict --prefix docs/tooling/rendered

      - name: Install preview ownership tools
        run: sudo apt-get install --yes lsof procps

      - name: Install exact Chrome for rendered evidence
        run: |
          kast_node="$(mise which node)"
          printf 'Resolved Node: %s\n' "$kast_node"
          "$kast_node" --version
          sudo "$kast_node" "$GITHUB_WORKSPACE/.github/tools/mintlify/node_modules/@puppeteer/browsers/lib/cjs/main-cli.js" install chrome@155.0.8059.84 --path "$GITHUB_WORKSPACE/build/documentation/browsers" --install-deps

      - name: Assess rendered candidate
        id: rendered
        continue-on-error: true
        run: >-
          uv run --locked --script docs/tooling/rendered/run.py --preview
          --browser-executable build/documentation/browsers/chrome/linux-155.0.8059.84/chrome-linux64/chrome
          --output build/reports/documentation/rendered

      - name: Admit exact documentation candidate
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked --project docs/tooling python docs/tooling/publication.py
          --rendered-report build/reports/documentation/rendered/receipt.json
          --prose-report build/reports/documentation/prose/receipt.json
          --report build/reports/documentation/publication.json

      - name: Keep documentation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/reports/documentation/
          if-no-files-found: error
