name: Developer release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main CI run whose retained bytes to publish
        required: true
        type: string
      run_attempt:
        description: Exact successful CI attempt
        required: true
        type: string
      source_revision:
        description: Exact source revision of the retained CI attempt (may lag main)
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: developer-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish complete retained products to preview
    if: >-
      vars.KAST_MACOS_CHECKS == 'true' &&
      vars.KAST_NATIVE_COMPILATION != 'false' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publication code is trusted main code, never a caller-selected revision.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Admit complete candidate and both native target qualifications
        id: candidate
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_revision }}
          MAIN_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          MAIN_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
        run: >-
          python3 .github/scripts/release/build_candidate.py promote-product
          --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA"
          --run-id "$MAIN_RUN_ID" --run-attempt "$MAIN_RUN_ATTEMPT" --bundle build/candidate
          --github-output "$GITHUB_OUTPUT"

      - name: Publish retained complete product and existing catalog
        if: steps.candidate.outputs.publication == 'PUBLISH'
        run: >-
          python3 .github/scripts/release/publish_developer.py product
          --directory build/candidate

      - name: Record documentation validation without publication
        if: steps.candidate.outputs.publication == 'DOCS_VALIDATED'
        run: echo 'DOCS_VALIDATED — exact source validated; developer product pointer unchanged.' >> "$GITHUB_STEP_SUMMARY"
