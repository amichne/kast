[project]
name = "kast-managed-installation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "defusedxml==0.7.1",
    "types-defusedxml==0.7.0.20260504",
]

[dependency-groups]
dev = ["ruff==0.14.0", "pyright[nodejs]==1.1.407", "pytest==9.0.3"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["local_product_probe.py", "product_acceptance.py", "product_lifecycle_probe.py", "test_product_acceptance.py", "component_probe.py", "immutable_store.py", "product_removal_recovery.py", "product_mcp_removal.py", "mcp_environment.py", "test_mcp_environment.py", "managed_product_removal.py", "runtime_base.py", "private_interpreter.py", "bootstrap_entry.py", "generate_bootstrap.py", "test-managed-bootstrap.py", "managed_product.py", "managed_product_installation.py", "test-managed-build-record.py", "test_composition_platform.py", "composition_platform.py", "composed_bundle.py", "test_composition_bundle.py", "isolated_runtime.py", "test_composition_isolated_runtime.py", "composed_host_probe.py", "test_composition_descriptors.py", "test_composition_host.py", "composed_host.py", "composition_descriptors.py", "composition_recipe.py", "composition_index.py", "test_composition_index.py", "composition_graph.py", "test_composition_graph.py", "managed_headless.py", "test-managed-headless.py", "managed_installation.py", "managed_release.py", "managed_update_journal.py", "managed_update_contract.py", "test-managed-installation.py", "test-managed-release.py", "test-managed-update-contract.py", "composed_release.py", "test_composition_release.py", "runtime_archive.py", "test_runtime_archive.py", "container_probe.py"]
extraPaths = [".", "../.github/scripts/release", "../.github/scripts/ci"]
reportUnusedCallResult = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["**/local_product_probe.py", "**/product_acceptance.py", "**/product_lifecycle_probe.py", "**/test_product_acceptance.py", "**/component_probe.py", "**/runtime_base.py", "**/managed_product_removal.py", "**/immutable_store.py", "**/product_removal_recovery.py", "**/product_mcp_removal.py", "**/mcp_environment.py", "**/test_mcp_environment.py"]
include = ["**/private_interpreter.py", "**/bootstrap_entry.py", "**/generate_bootstrap.py", "**/test-managed-bootstrap.py", "**/managed_product.py", "**/managed_product_installation.py", "**/test-managed-build-record.py", "**/test_composition_platform.py", "**/composition_platform.py", "**/composed_bundle.py", "**/test_composition_bundle.py", "**/isolated_runtime.py", "**/test_composition_isolated_runtime.py", "**/composed_host_probe.py", "**/test_composition_descriptors.py", "**/test_composition_host.py", "**/composed_host.py", "**/composition_descriptors.py", "**/composition_recipe.py", "**/composition_index.py", "**/test_composition_index.py", "**/composition_graph.py", "**/test_composition_graph.py", "**/managed_headless.py", "**/test-managed-headless.py", "**/managed_installation.py", "**/managed_release.py", "**/managed_update_journal.py", "**/managed_update_contract.py", "**/test-managed-installation.py", "**/test-managed-release.py", "**/test-managed-update-contract.py", "**/composed_release.py", "**/test_composition_release.py", "**/runtime_archive.py", "**/test_runtime_archive.py", "**/container_probe.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.per-file-target-version]
"managed_update_journal.py" = "py39"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
pythonpath = ["."]
python_files = ["test-managed-*.py", "test_composition_*.py", "test_runtime_archive.py", "test_mcp_environment.py", "test_product_acceptance.py"]
testpaths = ["."]
