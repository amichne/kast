name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release candidate
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Detach exact release source
        run: git checkout --detach "$GITHUB_SHA"

      - name: Resolve release version
        id: release_version
        run: >-
          python3 distribution/release/resolve_version.py
          --repository "$GITHUB_REPOSITORY"
          --bump "${{ inputs.bump }}"

      - name: Admit successful candidate build on main
        id: candidate
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: >-
          python3 distribution/release/release_eligibility.py
          --repository "$GITHUB_REPOSITORY"
          --source-revision "$GITHUB_SHA"
          --version "$RELEASE_VERSION"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Download candidate assets
        env:
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          CANDIDATE_ARTIFACT: ${{ steps.candidate.outputs.artifact_name }}
        run: >-
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name "$CANDIDATE_ARTIFACT" --dir build

      - name: Publish immutable GitHub release
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: >-
          bash .github/scripts/release/publish-release.sh
          --release "v${RELEASE_VERSION}"
          --commit "$GITHUB_SHA"
          --assets-directory "build/release/v${RELEASE_VERSION}"
