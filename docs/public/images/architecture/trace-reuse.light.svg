  <text x="232.2255" y="449.20000000000005" text-anchor="middle" font-size="13" font-weight="500" fill="#20231F"><tspan x="232.2255" dy="-3.9000000000000012">Final declarations</tspan><tspan x="232.2255" dy="16.900000000000002">all arrival evidence</tspan></text>
