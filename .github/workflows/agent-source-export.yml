name: Agent source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply staged agent patch
        run: |
          chunk_pattern='scripts/agent-red.patch.gz.b64.*'
          if compgen -G "$chunk_pattern" > /dev/null; then
            cat $chunk_pattern | base64 --decode | gunzip > /tmp/agent.patch
            git apply --check /tmp/agent.patch
            git apply /tmp/agent.patch
            rm -f $chunk_pattern scripts/agent-red.patch.gz.b64
            git config user.name "OpenAI Codex"
            git config user.email "codex@openai.com"
            git add --all
            git commit -m "test: define public surface regression proofs"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Package tracked source
        run: git archive --format=tar.gz --output=/tmp/kast-source.tar.gz HEAD

      - name: Upload tracked source
        uses: actions/upload-artifact@v4
        with:
          name: kast-source-${{ github.sha }}
          path: /tmp/kast-source.tar.gz
          if-no-files-found: error
          retention-days: 1
