name: Install source validation toolchain
description: Install the pinned JDK, Python test tools, jq oracle, Go and Node used by complete source validation
runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '25.0.4+7'

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: ".python-version"
        cache: pip
        cache-dependency-path: config/python/uv.lock

    # Python test dependencies come from the locked uv project in config/python.
    - name: Install uv
      shell: bash
      run: python3 -m pip install --disable-pip-version-check uv==0.12.9

    - uses: ./.github/actions/jq-oracle

    - name: Set up the frontend Go toolchain
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: manager/go.mod
        cache-dependency-path: manager/go.sum

    - name: Set up documentation parser runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.21.0"
