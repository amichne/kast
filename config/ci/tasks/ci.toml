# CI checks for .github/workflows/ci.yml.
#
# Each workflow step runs `mise run <task> [arguments]`. A developer or agent runs the same task
# locally. Values that GitHub Actions supplies have local defaults inside the task, so the
# command is identical in both places. `.github/scripts/ci/test_workflow_contract.py` rejects a
# workflow step that does anything else, a step that names an unknown task, and a task that no
# workflow step, dependency, or declared local aggregate uses.
#
# Description prefixes state what a task needs beyond the pinned toolchain:
#   [macOS] a macOS host; [container] a running container runtime; [network] public downloads;
#   [github] the GitHub API and an authenticated `gh`; [artifacts] outputs of earlier CI jobs.
# A task that lacks its requirement fails with a typed reason; it never reports success.

["ci:decisions"]
extends = "fixed"
description = "CI decision, candidate, and release preflight suites"
run = "uv run --locked --script .github/scripts/ci/fast_checks.py decisions"

["ci:scope"]
description = "Select the checks that a change requires"
run = "python3 .github/scripts/ci/validation_scope.py --affected"

["ci:portable"]
extends = "fixed"
description = "[container] Offline packaging suites in the disposable Linux container"
run = "./packaging/internal/verification/run-portable-tests-container.sh"

["ci:frontend-vulnerabilities"]
extends = "fixed"
description = "[network] Scan the Go frontend against the Go advisory database"
run = "uv run --locked --script manager/check vulnerabilities"

["ci:source"]
description = "Complete source obligations; add --affected --base <sha> --event <event> for the affected set"
run = "python3 .github/scripts/ci/source_validation.py"

["ci:storage"]
extends = "fixed"
description = "Require free workspace and scratch space for release assembly"
run = 'python3 .github/scripts/ci/build_storage.py check --minimum-bytes 8589934592 "${GITHUB_WORKSPACE:-$PWD}" "${RUNNER_TEMP:-${TMPDIR:-/tmp}}"'

["ci:assembly"]
extends = "fixed"
description = "[network] Assemble the release; local runs use version 0.0.0; run ci:storage first"
run = 'uv run --locked --script .github/scripts/ci/release_handoff.py assemble --version "0.0.${GITHUB_RUN_NUMBER:-0}"'

["ci:mac-runner"]
extends = "fixed"
description = "[github] Select the macOS product runner"
run = "python3 .github/scripts/ci/mac_runner.py"

["ci:mac-reset"]
extends = "fixed"
description = "[macOS] Exercise the macOS reset adapters"
run = "uv run --locked --script .github/scripts/ci/macos_reset_checks.py"

["ci:mac-qualify"]
extends = "fixed"
description = "[macOS] [artifacts] Exercise the exact assembled Mac Control product"
run = 'uv run --locked --script .github/scripts/ci/release_handoff.py qualify --version "0.0.${GITHUB_RUN_NUMBER:-0}"'

["ci:seal"]
extends = "fixed"
description = "[artifacts] Seal the complete immutable build record from the qualified product inputs"
run = "python3 .github/scripts/release/product_producer.py seal --macos-only --directory build/product-inputs --output build/product-candidate"

["ci:seal-two-platform"]
extends = "fixed"
description = "[artifacts] Seal one build record for macOS ARM64 and Linux x86-64 from the qualified product inputs"
run = "python3 .github/scripts/release/product_producer.py seal --directory build/product-inputs --output build/product-two-platform"

["ci:acceptance-baseline"]
description = "Read the checked-in acceptance baseline pin; --github-output exposes it to later steps"
run = "python3 .github/scripts/ci/acceptance_inputs.py baseline"

["ci:acceptance-inputs"]
description = "[network] [github] [artifacts] Admit the baseline's provenance and the pinned private interpreter"
run = "python3 .github/scripts/ci/acceptance_inputs.py admit"

["ci:acceptance"]
description = "[macOS] [artifacts] Exercise the installed CLI, MCP, and lifecycle against the baseline and candidate"
run = 'uv run --locked --project packaging python packaging/internal/verification/product_lifecycle_probe.py --candidate build/product-candidate --baseline build/product-baseline --private-python-archive build/private-python.tar.gz --private-dependency build/defusedxml.whl --evidence build/installed-evidence'

["ci:join"]
extends = "fixed"
description = "[artifacts] Join installed acceptance to the sealed record without rewriting it"
run = "python3 .github/scripts/release/product_producer.py accept --directory build/product-sealed --receipt build/product-acceptance --output build/product-candidate"

["ci:required"]
description = "[github] Require the checks that scope selected; --source-proof or --source-feedback narrows the set"
run = "python3 .github/scripts/ci/required_checks.py"

["ci:outcome"]
extends = "fixed"
description = "[github] Seal the successful validation outcome"
run = "python3 .github/scripts/ci/validation_outcome.py --affected --record build/validation/validation.json"

["ci:rollout"]
description = "Replay one frozen change from the CI corpus; pass --case and --mode"
run = "python3 .github/scripts/ci/rollout.py"

# Local aggregates. They run, one after another, the jobs a pull request requires on this host.
# They run sequentially because source validation rejects a tree that changes during the run.

["ci:pr"]
tags = ["local"]
extends = "fixed"
description = "Every pull-request check that runs without macOS, a container, or CI artifacts"
run = [{ task = "ci:decisions" }, { task = "docs:all" }, { task = "ci:source" }]

["ci:pr-full"]
tags = ["local"]
extends = "fixed"
description = "[container] [macOS] ci:pr plus the portable container and the macOS reset adapters"
run = [{ task = "ci:pr" }, { task = "ci:portable" }, { task = "ci:mac-reset" }]

["ci:report-switches"]
extends = "fixed"
description = "Report the effective CI switches in the GitHub step summary"
run = '''
echo "Semantic fixture switch: $KAST_SEMANTIC_FIXTURES" >> "$GITHUB_STEP_SUMMARY"
echo "macOS check switch: $KAST_MACOS_CHECKS; effective product assembly: $KAST_NATIVE_COMPILATION" >> "$GITHUB_STEP_SUMMARY"
'''

["ci:require-result"]
description = "Require the actual upstream result to match the expected result"
run = '''
#!/usr/bin/env python3
import sys

if len(sys.argv) != 3 or sys.argv[1] != sys.argv[2]:
    sys.exit("Upstream result did not match the expected result")
'''
