name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Mintlify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/tooling/likec4/package-lock.json

      - name: Install Mintlify CLI
        run: npm install --global mint@4.2.841

      - name: Generate canonical operation registry
        run: ./gradlew :protocol:wire:generateOperationRegistry

      - name: Check generated architecture proof
        run: python3 docs/tooling/likec4/generate_bundle.py --check

      - name: Check documentation contract
        run: python3 docs/test_public_docs.py

      - name: Validate Mintlify build
        working-directory: docs/public
        run: mint validate
