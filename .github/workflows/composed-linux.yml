name: Isolated runtime candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact numeric version for the candidates
        required: true
        default: 0.0.0
        type: string
      action_revision:
        description: Retired archive-action input; must be empty
        required: false
        type: string
      linux_only:
        description: Assemble and qualify only Linux x86-64
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUNDLE_VERSION: ${{ inputs.version }}
  ACTION_REVISION: ${{ inputs.action_revision }}

jobs:
  candidate:
    name: Replay the Linux upgrade with the qualified fix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 46ac330f9db25aab6be46df0ced2da250d59c37f
          persist-credentials: false

      - name: Admit source and version
        env:
          TARGET: linux-x86_64
        run: |
          bash .github/scripts/release/admit-source.sh --expected-source-revision "46ac330f9db25aab6be46df0ced2da250d59c37f"
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", os.environ["BUNDLE_VERSION"]), "numeric version required"; assert not os.environ["ACTION_REVISION"], "archive-action contract retired; action_revision must be empty"'

      - name: Set up Python
        id: candidate-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check workspace and scratch free space
        run: python3 .github/scripts/ci/build_storage.py check --minimum-bytes 8589934592 "$GITHUB_WORKSPACE" /tmp

      - name: Set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3


      - name: Download exact candidate bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: 14344009901
          run-id: 44119663473
          github-token: ${{ github.token }}
          path: build/composed-release

      - name: Download exact assembly qualification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: 14345038424
          run-id: 44119663473
          github-token: ${{ github.token }}
          path: build/retained-qualification

      - name: Find the single retained assembly receipt
        run: |
          mapfile -t receipts < <(find build/retained-qualification -name qualification.json -type f)
          test "${#receipts[@]}" -eq 1
          mkdir -p build/composed-evidence
          cp "${receipts[0]}" build/composed-evidence/qualification.json

      - name: Verify the exact component assembly
        timeout-minutes: 60
        shell: bash
        env:
          CANDIDATE_PYTHON: ${{ steps.candidate-python.outputs.python-path }}
          TARGET: linux-x86_64
        run: |
          scratch=$(cd /tmp && pwd -P)
          python=$CANDIDATE_PYTHON
          if [[ "$TARGET" == linux-* ]]; then
            python=/usr/bin/python3
          fi
          "$python" --version
          archive="$PWD/build/composed-release/kast-composed-setup-v${BUNDLE_VERSION}-$TARGET.tar.gz"
          digest=$(cut -d ' ' -f1 "${archive}.sha256")
          runtime="$PWD/build/composed-release/kast-runtime-v${BUNDLE_VERSION}-$TARGET.zip"
          runtime_digest=$(cut -d ' ' -f1 "${runtime}.sha256")
          "$python" -E -s -B packaging/internal/composition/composed_release.py qualify \
            --archive "$archive" --archive-sha256 "$digest" \
            --runtime-archive "$runtime" --runtime-sha256 "$runtime_digest" \
            --root "$scratch/kc" --evidence "$PWD/build/replay-qualification" \
            --version "$BUNDLE_VERSION" --source-revision "46ac330f9db25aab6be46df0ced2da250d59c37f"

      - name: Download the same sealed upgrade baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-sealed-fae2343f81c25d1fcc5c1deadfe2757c2573c271-1
          run-id: 43372523369
          github-token: ${{ github.token }}
          path: build/product-baseline

      - name: Upgrade and uninstall the exact fixed Linux candidate
        env:
          JAVA_RELEASE: build/java-release
        run: |
          sudo loginctl enable-linger "$(id -un)"
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user start default.target
          cp "$(mise where java)/release" "$JAVA_RELEASE"
          PYTHONPATH=packaging/internal/verification mise exec -- uv run --locked --project packaging python - <<'PYTHON'
          import argparse
          import os
          from pathlib import Path
          import tempfile
          import linux_coordinator_probe as native
          from product_lifecycle_probe import Probe, candidate, product

          repo = Path.cwd()
          baseline_dir = repo / 'build/product-baseline'
          baseline = candidate.read_baseline(baseline_dir)
          assert isinstance(baseline, product.ProductRecord) and baseline.version == '0.0.4324'
          work = Path(tempfile.mkdtemp(prefix='kast-installed-native-')).resolve()
          record = native.sealed_inputs(argparse.Namespace(
              directory=repo/'build/composed-release',
              receipt=repo/'build/composed-evidence/qualification.json',
              java_release=repo/os.environ['JAVA_RELEASE'],
              revision='46ac330f9db25aab6be46df0ced2da250d59c37f',
              version=os.environ['BUNDLE_VERSION'],
              control=Path('/tmp/kc/components/control/share/kast/libexec/kast-management'),
          ), repo, work)
          python, dependency = native.fetch_interpreter(work)
          home = work/'home'
          home.mkdir(mode=0o700)
          root = home/'.local/share/kast'
          fixture = work/'first'
          native.fixture(repo, fixture)
          evidence = repo/'build/installed-upgrade'
          evidence.mkdir()
          env = {'PATH': os.defpath, 'HOME': str(home), 'TMPDIR': str(work),
                 'XDG_CACHE_HOME': str(home/'.cache'), 'XDG_CONFIG_HOME': str(home/'.config'),
                 'XDG_DATA_HOME': str(home/'.local/share'), 'XDG_STATE_HOME': str(home/'.local/state'),
                 'GRADLE_USER_HOME': str(work/'gradle'), 'KAST_OUTPUT_TOON': '0'}
          os.environ.clear()
          os.environ.update(env)
          probe = Probe(root, home, evidence, python, dependency, env)
          probe.install(baseline_dir, baseline)
          previous = probe.query('baseline', fixture)
          _ = probe.observe_host('baseline-host', fixture, previous,
                                next(t for t in baseline.targets if t.target == native.TARGET).runtime.sha256)
          probe.install(work/'inputs', record)
          upgraded = probe.query('upgrade', fixture)
          host = probe.observe_host('upgraded-host', fixture, upgraded, record.targets[0].runtime.sha256)
          assert upgraded != previous
          profile_home = next(p for p in Path(host.profile).parents if p.name == 'home')
          assert (profile_home/'.kast').is_dir()
          assert all((p.stat().st_mode & 0o077) == 0 for p in [profile_home/'.kast', *(p for p in (profile_home/'.kast').rglob('*') if p.is_dir())])
          probe.run('upgrade-uninstall', fixture, ('uninstall',))
          probe.stopped_endpoints(host)
          assert not root.exists() and not (root.parent/'kast-workspaces').exists()
          print('Upgrade, owner-only state directories and public uninstall passed')
          PYTHON


      - name: Retain installed replay evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-fixed-upgrade-replay
          path: build/installed-upgrade/
          if-no-files-found: warn
          retention-days: 14
