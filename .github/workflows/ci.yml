name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      rollout:
        description: Frozen CI corpus phase
        type: choice
        default: none
        options: [none, warm, changed, reuse, cold]
      rollout_case:
        description: Frozen case to measure through its own aggregate
        type: choice
        default: all
        options: [all, documentation, leaf-service, semantic-adapter, shared-contract]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KAST_SEMANTIC_FIXTURES: ${{ vars.KAST_SEMANTIC_FIXTURES || 'false' }}
  KAST_MACOS_CHECKS: ${{ vars.KAST_MACOS_CHECKS || 'false' }}
  KAST_NATIVE_COMPILATION: ${{ vars.KAST_MACOS_CHECKS == 'true' && (vars.KAST_NATIVE_COMPILATION || 'true') || 'false' }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.rollout_case && inputs.rollout_case != 'all' && format('-{0}', inputs.rollout_case) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
      product: ${{ steps.scope.outputs.product }}
      portable: ${{ steps.scope.outputs.portable }}
      documentation: ${{ steps.scope.outputs.documentation }}
      scope: ${{ steps.scope.outputs.scope }}
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Report CI switches
        run: mise run ci:report-switches

      - name: Test CI decisions
        run: mise run ci:decisions

      - name: Select checks
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          mise run ci:scope --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA"
          --head "$CHECKOUT_SHA" --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  documentation:
    needs: scope
    if: needs.scope.outputs.documentation == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  portable:
    needs: scope
    if: needs.scope.outputs.portable == 'run'
    name: Offline packaging in disposable container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: Run offline packaging suites
        run: mise run ci:portable

  source-work:
    needs: scope
    if: needs.scope.outputs.source == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    name: Source obligations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.scope.outputs.product == 'run' && github.sha || github.event.pull_request.head.sha || github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv

      - uses: ./.github/actions/source-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        env:
          # Shared with gradle-cache.yml so a dispatched seed is this job's newest entry.
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: source-work
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: linux-source
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Only main writes. Its entries serve every ref, and pull requests no longer evict them
          # from the repository's 10 GB cache with entries no other pull request can read.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          # IDEA library transform outputs also live under caches.
          gradle-home-cache-includes: |
            caches
            notifications

      - name: Scan the frontend against the Go advisory database
        run: mise run ci:frontend-vulnerabilities

      - name: Validate affected source obligations
        if: needs.scope.outputs.product == 'skip'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_VERIFICATION_PLAN: ${{ needs.scope.outputs.plan }}
        run: mise run ci:source --affected --base "$BASE_SHA" --event "$GITHUB_EVENT_NAME"

      - name: Validate complete candidate source obligations
        if: needs.scope.outputs.product == 'run'
        run: mise run ci:source

      - name: Retain source evidence
        if: always() && (inputs.rollout == '' || inputs.rollout == 'none')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-source-reports-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: error
          retention-days: 14

  # The Control executable cross-compiles and its JVM payload is portable, so Linux assembles the macOS release.
  assembly:
    name: Assemble release on Linux
    needs: scope
    if: vars.KAST_MACOS_CHECKS == 'true' && needs.scope.outputs.product == 'run'
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv
      - name: Check workspace and scratch free space
        run: mise run ci:storage
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Set up the frontend Go toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum
      - name: Assemble the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run ci:assembly
      - id: handoff
        uses: actions/upload-artifact@v7.0.2
        with:
          name: assembled-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/handoff-output/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: assembly-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  # Observe the Mac when the product job becomes ready.
  kotlin-runner:
    name: Select macOS product runner
    needs: [scope, assembly]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.select.outputs.labels || '"macos-15"' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
      - id: select
        if: github.ref == 'refs/heads/main'
        env:
          KAST_PREFER_LOCAL_MAC: ${{ vars.KAST_PREFER_LOCAL_MAC }}
          KAST_RUNNER_STATUS_TOKEN: ${{ secrets.KAST_RUNNER_STATUS_TOKEN }}
        run: mise run ci:mac-runner

  kotlin:
    name: Kotlin product
    # Runs beside source-work; the required job still demands its source proof.
    needs: [scope, assembly, kotlin-runner]
    # A superseded run must release its Mac: always() would keep or even start this job.
    if: ${{ !cancelled() && vars.KAST_MACOS_CHECKS == 'true' && needs.scope.outputs.product == 'run' && needs.assembly.result == 'success' && needs.kotlin-runner.result == 'success' && (inputs.rollout == '' || inputs.rollout == 'none') }}
    runs-on: ${{ fromJSON(needs.kotlin-runner.outputs.labels) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment != 'self-hosted'
        with:
          python-version-file: .python-version
      - name: Set up local Python
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/local-python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.assembly.outputs.artifact_id || '0' }}
          merge-multiple: true
          path: build/handoff-input/
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          # The local runner keeps its own Gradle home and never writes hosted caches.
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Exercise macOS reset adapters
        run: mise run ci:mac-reset
      - uses: ./.github/actions/jq-oracle
      - name: Exercise the exact assembled Mac Control product
        run: mise run ci:mac-qualify
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: macos-query-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/publicLauncherTest/
            build/reports/tests/publicLauncherTest/
            build/reports/native/reset-checks/
            build/reports/native/qualification/
            distribution/cli/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  composed-macos:
    name: macOS complete-product qualification
    # Qualification runs beside source-work; sealed-product requires the source proof.
    needs: [scope, assembly]
    if: >-
      !cancelled() &&
      needs.assembly.result == 'success' &&
      needs.scope.outputs.product == 'run' && vars.KAST_MACOS_CHECKS == 'true' &&
      vars.KAST_NATIVE_COMPILATION != 'false' &&
      (inputs.rollout == '' || inputs.rollout == 'none')
    uses: ./.github/workflows/composed-linux.yml
    with:
      version: 0.0.${{ github.run_number }}
      complete_product: true
      release_target: macos-aarch64
      assembled_artifact_id: ${{ needs.assembly.outputs.artifact_id }}

  composed-linux:
    name: Linux complete-product qualification
    # Linux assembles its own release, so it waits for no Mac input.
    needs: scope
    if: >-
      needs.scope.outputs.product == 'run' && vars.KAST_MACOS_CHECKS == 'true' &&
      vars.KAST_NATIVE_COMPILATION != 'false' &&
      (inputs.rollout == '' || inputs.rollout == 'none')
    uses: ./.github/workflows/composed-linux.yml
    with:
      version: 0.0.${{ github.run_number }}
      complete_product: true
      release_target: linux-x86_64

  sealed-product:
    # Baseline admission requires this job name.
    name: Seal both product targets without rebuilding
    # Sealing reads only the qualified product inputs. Source proof gates the join,
    # so installed acceptance starts as soon as the product is sealed.
    needs: [scope, composed-macos, composed-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Each product artifact carries the attempt of the job that produced it. A rerun of
    # failed jobs copies a successful producer with its outputs, so consumers name the
    # producer's attempt rather than their own.
    outputs:
      run_attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kast-qualified-product-macos-aarch64-${{ github.sha }}-${{ github.run_id }}-${{ needs.composed-macos.outputs.run_attempt }}
          path: build/product-inputs/macos-aarch64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kast-qualified-product-linux-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ needs.composed-linux.outputs.run_attempt }}
          path: build/product-inputs/linux-x86_64
      - name: Seal the complete immutable build record
        run: mise run ci:seal
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-product-sealed-${{ github.sha }}-${{ github.run_attempt }}
          path: build/product-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # The parts together prove every acceptance case for a target. Each has its own runner and HOME.
  installed-macos-upgrade:
    name: Installed macOS upgrade acceptance
    needs: sealed-product
    uses: ./.github/workflows/installed-acceptance.yml
    with:
      target: macos-aarch64
      part: upgrade
      sealed_run_attempt: ${{ needs.sealed-product.outputs.run_attempt }}

  installed-macos-fresh:
    name: Installed macOS fresh acceptance
    needs: sealed-product
    uses: ./.github/workflows/installed-acceptance.yml
    with:
      target: macos-aarch64
      part: fresh
      sealed_run_attempt: ${{ needs.sealed-product.outputs.run_attempt }}

  installed-linux-upgrade:
    name: Installed Linux upgrade acceptance
    needs: sealed-product
    uses: ./.github/workflows/installed-acceptance.yml
    with:
      target: linux-x86_64
      part: upgrade
      sealed_run_attempt: ${{ needs.sealed-product.outputs.run_attempt }}

  installed-linux-fresh:
    name: Installed Linux fresh acceptance
    needs: sealed-product
    uses: ./.github/workflows/installed-acceptance.yml
    with:
      target: linux-x86_64
      part: fresh
      sealed_run_attempt: ${{ needs.sealed-product.outputs.run_attempt }}

  complete-product:
    name: Join installed acceptance without rewriting the build record
    needs: [source-work, sealed-product, installed-macos-upgrade, installed-macos-fresh, installed-linux-upgrade, installed-linux-fresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-product-sealed-${{ github.sha }}-${{ needs.sealed-product.outputs.run_attempt }}
          path: build/product-sealed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kast-installed-upgrade-macos-aarch64-${{ github.sha }}-${{ github.run_id }}-${{ needs.installed-macos-upgrade.outputs.run_attempt }}
          path: build/product-acceptance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kast-installed-fresh-macos-aarch64-${{ github.sha }}-${{ github.run_id }}-${{ needs.installed-macos-fresh.outputs.run_attempt }}
          path: build/product-acceptance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kast-installed-upgrade-linux-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ needs.installed-linux-upgrade.outputs.run_attempt }}
          path: build/product-acceptance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kast-installed-fresh-linux-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ needs.installed-linux-fresh.outputs.run_attempt }}
          path: build/product-acceptance
      - name: Join installed acceptance to the sealed record
        run: mise run ci:join
      # The candidate carries its sealed record's attempt, so admission derives its name.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-product-candidate-${{ github.sha }}-${{ needs.sealed-product.outputs.run_attempt }}
          path: build/product-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  source:
    name: Source validation
    needs: [scope, source-work]
    if: always() && needs.scope.outputs.source == 'run' && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: Require the selected source-proof producer
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: mise run ci:required --source-proof

  source-feedback:
    name: Source feedback
    needs: [scope, source, documentation, portable]
    if: always() && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: Require source obligations
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: mise run ci:required --source-feedback

  # A pull request never reports the check that main requires. Only a queue run on the exact
  # result for main, or a run on main, has selected the product gate and can report it.
  required:
    name: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') && 'Pull request checks' || 'CI required checks' }}
    needs: [scope, source, documentation, portable, kotlin, complete-product]
    if: always() && (inputs.rollout == '' || inputs.rollout == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: Require selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: mise run ci:required

      - name: Require installed acceptance on both platforms for the selected product gate
        if: needs.scope.outputs.product == 'run'
        env:
          COMPLETE_PRODUCT_RESULT: ${{ needs.complete-product.result }}
        run: mise run ci:require-result "$COMPLETE_PRODUCT_RESULT" success

      - name: Seal successful validation outcome
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: mise run ci:outcome

      - name: Retain exact validation outcome
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-validation-outcome-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: build/validation/validation.json
          if-no-files-found: error
          retention-days: 30

  rollout:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.rollout != 'none'
    name: Frozen rollout (${{ matrix.case }}, ${{ inputs.rollout }})
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.rollout_case == 'all' && '["documentation","leaf-service","semantic-adapter","shared-contract"]' || format('["{0}"]', inputs.rollout_case)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the task runner
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv

      - name: Set up Java 25
        id: jdk25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: ${{ inputs.rollout != 'cold' && 'pip' || '' }}
          cache-dependency-path: config/python/uv.lock

      - uses: ./.github/actions/jq-oracle

      - name: Set up the frontend Go toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum

      - name: Set up documentation parser runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          cache-disabled: ${{ inputs.rollout == 'cold' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Only the explicit rollout warm-up writes this branch-scoped cache.
          # Routine PR policy remains read-only.
          cache-read-only: ${{ inputs.rollout != 'warm' }}
          cache-cleanup: on-success
          # caches includes caches/build-cache-1, Gradle's local task-output cache.
          # IDEA library transform outputs also live under caches.
          gradle-home-cache-includes: |
            caches
            notifications

      - name: Replay frozen change
        env:
          KAST_RELEASE_JDK_25: ${{ steps.jdk25.outputs.path }}
          ROLLOUT_CASE: ${{ matrix.case }}
          ROLLOUT_MODE: ${{ inputs.rollout }}
        run: mise run ci:rollout --case "$ROLLOUT_CASE" --mode "$ROLLOUT_MODE"

      - name: Retain source evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-rollout-${{ matrix.case }}-${{ inputs.rollout }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/
            **/build/test-results/
          if-no-files-found: error
          retention-days: 14

  rollout-feedback:
    name: Frozen rollout feedback
    needs: [scope, rollout, portable]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.rollout != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
      - name: Require every corpus result and portable checks
        env:
          ROLLOUT_SUCCESS: ${{ needs.scope.result == 'success' && needs.rollout.result == 'success' && needs.portable.result == 'success' }}
        run: mise run ci:require-result "$ROLLOUT_SUCCESS" true
