[project]
name = "kast-documentation-tooling"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema==4.26.0"]

[dependency-groups]
dev = ["ruff==0.14.0", "pyright[nodejs]==1.1.407", "pytest==8.4.2", "types-jsonschema==4.26.0.20261006"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["glossary_json.py", "check_glossary.py", "markdown_parser.py", "test_glossary.py", "test_markdown_parser.py"]
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["glossary_json.py", "check_glossary.py", "markdown_parser.py", "test_glossary.py", "test_markdown_parser.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S603"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["."]
pythonpath = ["."]
filterwarnings = ["error"]
