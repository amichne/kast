name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contracts:
    name: Workflow release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enforce repository shape
        shell: bash
        run: |
          bash .github/scripts/test-repository-shape-contract.sh
          python3 .github/scripts/check-repository-shape.py

      - name: Capture immutable local source snapshot
        shell: bash
        run: |
          set -euo pipefail
          scripts/capture-local-source-snapshot.py \
            --source-root "$GITHUB_WORKSPACE" \
            --output-file dist/local-source/source-snapshot.json \
            >/dev/null
          scripts/verify-ci-artifact-ledger.py record \
            --output dist/ci-ledgers/local-source-snapshot.json \
            --git-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind ci-local-source-snapshot \
            --artifact-name kast-local-source-snapshot \
            --artifact-path dist/local-source/source-snapshot.json \
            --producer-job workflow-contracts \
            --build-command-id ci-static-local-source-snapshot

      - name: Upload immutable local source snapshot
        uses: actions/upload-artifact@v6
        with:
          name: kast-local-source-snapshot
          path: dist/local-source/source-snapshot.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload immutable local source snapshot ledger
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifact-ledger-local-source-snapshot
          path: dist/ci-ledgers/local-source-snapshot.json
          if-no-files-found: error
          retention-days: 3

      - name: Test release workflow contract
        shell: bash
        run: ./.github/scripts/release/test-release-workflow-contract.sh

      - name: Test deterministic agent resource assets
        run: python3 .github/scripts/release/test-agent-resource-assets.py

      - name: Test release indexing benchmark contract
        shell: bash
        run: ./.github/scripts/test-release-indexing-benchmark-contract.sh

      - name: Test CI workflow graph model
        shell: bash
        run: ./.github/scripts/ci/test-ci-workflow-model.sh

      - name: Test Kast build contract
        shell: bash
        run: ./.github/scripts/ci/test-kast-build-contract.sh

      - name: Test docs navigation contract
        shell: bash
        run: ./.github/scripts/docs/test-docs-navigation-contract.sh

      - name: Test docs content contract
        shell: bash
        run: ./.github/scripts/docs/test-docs-content-contract.sh

      - name: Test terminal command contract
        shell: bash
        run: ./.github/scripts/docs/test-terminal-command-contract.sh

      - name: Test macOS installer contract
        shell: bash
        run: ./.github/scripts/install/test-macos-installer-contract.sh

      - name: Test release asset verifier
        shell: bash
        run: ./.github/scripts/release/test-release-asset-verifier.sh

      - name: Test release provenance assembler
        shell: bash
        run: ./.github/scripts/release/test-release-provenance-assembler.sh

      - name: Test CI artifact ledger
        shell: bash
        run: ./.github/scripts/ci/test-ci-artifact-ledger.sh

      - name: Test CI Gradle retry helper
        shell: bash
        run: ./.github/scripts/ci/test-ci-gradle-retry.sh

  local-authority-contracts:
    name: Local development authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Install Rust for local-authority contracts
        uses: dtolnay/rust-toolchain@stable

      - name: Cache local-authority Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: cli-rs -> target
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test local development refresh contract
        shell: bash
        run: ./.github/scripts/install/test-local-development-refresh-contract.sh

  runtime-compatibility-contract:
    name: Runtime compatibility matrix
    runs-on: ubuntu-latest
    needs: workflow-contracts
    steps:
      - uses: actions/checkout@v5

      - name: Test runtime compatibility contract
        shell: bash
        run: ./.github/scripts/runtime/test-runtime-compatibility-contract.sh

  maven-publication-contract:
    name: Maven publication metadata
    runs-on: ubuntu-latest
    needs: workflow-contracts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Publish public modules to Maven local
        run: >
          ./scripts/ci-gradle-retry.sh
          ./gradlew
          :build-logic:test
          :analysis-api:publishToMavenLocal
          :analysis-server:publishToMavenLocal
          :index-store:publishToMavenLocal
          -Pkast.publish.target=local
          -Pversion=0.0.0-ci

      - name: Record Maven publication validation ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ci-ledgers
          printf 'gitSha=%s\nsourceRef=%s\nworkflowRunId=%s\n' \
            "$GITHUB_SHA" \
            "$GITHUB_REF" \
            "$GITHUB_RUN_ID" \
            > dist/ci-ledgers/maven-publication-validation.txt
          scripts/verify-ci-artifact-ledger.py record \
            --output dist/ci-ledgers/maven-publication.json \
            --git-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind ci-maven-publication-validation \
            --artifact-name ci-maven-publication-validation \
            --artifact-path dist/ci-ledgers/maven-publication-validation.txt \
            --producer-job maven-publication-contract \
            --build-command-id ci-maven-publish-to-local

      - name: Upload Maven publication validation ledger
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifact-ledger-maven-publication
          path: dist/ci-ledgers/maven-publication.json
          if-no-files-found: error
          retention-days: 3

  rust-cli:
    name: Rust CLI
    runs-on: ubuntu-22.04
    needs: workflow-contracts
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: nextest
          fallback: none

      - name: Install cargo-deny
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-deny
          fallback: none

      - name: Cache Rust validation builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: cli-rs -> target
          shared-key: rust-cli-validation
          cache-bin: "false"

      - name: Test Rust agent tooling contract
        shell: bash
        run: ./.github/scripts/ci/test-rust-agent-tooling-contract.sh

      - name: Check Rust dependency policy
        working-directory: cli-rs
        run: cargo deny --locked --all-features check

      - name: Check Rust formatting
        working-directory: cli-rs
        run: cargo fmt --all -- --check

      - name: Check Rust lints
        working-directory: cli-rs
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust CLI with slow-test reporting
        working-directory: cli-rs
        run: cargo nextest run --locked --all-targets --all-features --profile ci

      - name: Upload Rust test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-cli-nextest-junit
          path: cli-rs/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 3

  source-bound-cli:
    name: Source-bound release CLI
    runs-on: ubuntu-22.04
    needs: workflow-contracts
    steps:
      - uses: actions/checkout@v5

      - name: Download local source snapshot
        uses: actions/download-artifact@v7
        with:
          name: kast-local-source-snapshot
          path: build/ci-inputs

      - name: Download local source snapshot ledger
        uses: actions/download-artifact@v7
        with:
          name: ci-artifact-ledger-local-source-snapshot
          path: build/ci-input-ledgers

      - name: Verify local source snapshot
        id: local-source-snapshot
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-ci-artifact-ledger.py verify \
            --ledger build/ci-input-ledgers/local-source-snapshot.json \
            --git-sha "$GITHUB_SHA" \
            --require-kind ci-local-source-snapshot \
            --artifact ci-local-source-snapshot=build/ci-inputs/source-snapshot.json
          source_sha256="$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("build/ci-inputs/source-snapshot.json").read_text(encoding="utf-8"))["sourceTreeSha256"])')"
          printf 'source_sha256=%s\n' "$source_sha256" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache source-bound release build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: cli-rs -> target
          shared-key: source-bound-cli-release
          cache-bin: "false"

      - name: Build Rust CLI
        working-directory: cli-rs
        run: >
          KAST_VERSION=0.0.0-ci
          KAST_LOCAL_SOURCE_SHA256="${{ steps.local-source-snapshot.outputs.source_sha256 }}"
          cargo build --release --locked

      - name: Validate generated CLI contracts
        run: |
          cp cli-rs/target/release/kast cli-rs/target/release/kastctl
          cli-rs/target/release/kastctl developer release generate contract --check

      - name: Package Rust CLI CI asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist cli-rs/target/package/kast-v0.0.0-ci-linux-x64
          cp cli-rs/target/release/kast cli-rs/target/package/kast-v0.0.0-ci-linux-x64/kastctl
          cp cli-rs/target/release/kast cli-rs/target/package/kast-v0.0.0-ci-linux-x64/kast
          chmod 755 cli-rs/target/package/kast-v0.0.0-ci-linux-x64/kastctl cli-rs/target/package/kast-v0.0.0-ci-linux-x64/kast
          cmp -s cli-rs/target/package/kast-v0.0.0-ci-linux-x64/kastctl cli-rs/target/package/kast-v0.0.0-ci-linux-x64/kast
          (cd cli-rs/target/package/kast-v0.0.0-ci-linux-x64 && zip -9 -q "$GITHUB_WORKSPACE/dist/kast-v0.0.0-ci-linux-x64.zip" kastctl kast)
          scripts/verify-ci-artifact-ledger.py record \
            --output dist/ci-ledgers/rust-cli-linux-x64.json \
            --git-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind ci-rust-cli-linux-x64 \
            --artifact-name kast-rust-cli-linux-x64 \
            --artifact-path dist/kast-v0.0.0-ci-linux-x64.zip \
            --producer-job source-bound-cli \
            --build-command-id ci-rust-cli-release-build

      - name: Upload Rust CLI CI asset
        uses: actions/upload-artifact@v6
        with:
          name: kast-rust-cli-linux-x64
          path: dist/kast-v0.0.0-ci-linux-x64.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload Rust CLI CI ledger
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifact-ledger-rust-cli-linux-x64
          path: dist/ci-ledgers/rust-cli-linux-x64.json
          if-no-files-found: error
          retention-days: 3

  build-and-test-linux:
    name: JVM and indexer tests
    runs-on: ubuntu-latest
    needs: workflow-contracts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Free disk for indexer tests
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Test JVM modules and indexer
        run: >
          ./scripts/ci-gradle-retry.sh
          ./gradlew
          :analysis-api:test
          :analysis-server:test
          :index-store:test
          :indexer:test
          -PexcludeTags=performance

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-and-test-reports-ubuntu-latest
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 3

  source-bound-indexer:
    name: Source-bound indexer
    runs-on: ubuntu-24.04
    needs: workflow-contracts
    steps:
      - uses: actions/checkout@v5

      - name: Download local source snapshot
        uses: actions/download-artifact@v7
        with:
          name: kast-local-source-snapshot
          path: build/ci-inputs

      - name: Download local source snapshot ledger
        uses: actions/download-artifact@v7
        with:
          name: ci-artifact-ledger-local-source-snapshot
          path: build/ci-input-ledgers

      - name: Verify local source snapshot
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-ci-artifact-ledger.py verify \
            --ledger build/ci-input-ledgers/local-source-snapshot.json \
            --git-sha "$GITHUB_SHA" \
            --require-kind ci-local-source-snapshot \
            --artifact ci-local-source-snapshot=build/ci-inputs/source-snapshot.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Build source-bound indexer distribution
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci-gradle-retry.sh ./gradlew \
            :indexer:portableDistZip \
            :indexer:verifyPortableDistLayout
          mapfile -t archives < <(find indexer/build/distributions -maxdepth 1 -type f -name 'indexer-*-portable.zip' -print)
          [[ "${#archives[@]}" -eq 1 ]] || { printf 'expected one indexer archive, found %s\n' "${#archives[@]}" >&2; exit 1; }
          mkdir -p build/distributions dist/ci-ledgers
          cp "${archives[0]}" build/distributions/kast-local-source-bound-indexer.zip
          scripts/verify-ci-artifact-ledger.py record \
            --output dist/ci-ledgers/indexer-linux-x64.json \
            --git-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind ci-indexer-linux-x64 \
            --artifact-name kast-indexer-linux-x64 \
            --artifact-path build/distributions/kast-local-source-bound-indexer.zip \
            --producer-job source-bound-indexer \
            --build-command-id ci-indexer-source-bound-development

      - name: Upload source-bound indexer distribution
        uses: actions/upload-artifact@v6
        with:
          name: kast-indexer-linux-x64
          path: build/distributions/kast-local-source-bound-indexer.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload source-bound indexer ledger
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifact-ledger-indexer-linux-x64
          path: dist/ci-ledgers/indexer-linux-x64.json
          if-no-files-found: error
          retention-days: 3

  source-bound-linux-setup:
    name: Source-bound Linux setup bundle
    runs-on: ubuntu-24.04
    needs:
      - workflow-contracts
      - source-bound-cli
      - source-bound-indexer
    steps:
      - uses: actions/checkout@v5

      - name: Download source-bound CLI
        uses: actions/download-artifact@v7
        with:
          name: kast-rust-cli-linux-x64
          path: build/ci-inputs

      - name: Download source-bound CLI ledger
        uses: actions/download-artifact@v7
        with:
          name: ci-artifact-ledger-rust-cli-linux-x64
          path: build/ci-input-ledgers

      - name: Download source-bound indexer
        uses: actions/download-artifact@v7
        with:
          name: kast-indexer-linux-x64
          path: build/ci-inputs

      - name: Download source-bound indexer ledger
        uses: actions/download-artifact@v7
        with:
          name: ci-artifact-ledger-indexer-linux-x64
          path: build/ci-input-ledgers

      - name: Verify and package canonical Linux setup
        shell: bash
        run: |
          set -euo pipefail
          cli_asset="build/ci-inputs/kast-v0.0.0-ci-linux-x64.zip"
          indexer_asset="build/ci-inputs/kast-local-source-bound-indexer.zip"
          setup_asset="dist/kast-linux-x64-v0.0.0-ci.tar.gz"
          setup_manifest_version="v0.7.11-ci"
          scripts/verify-ci-artifact-ledger.py verify \
            --ledger build/ci-input-ledgers/rust-cli-linux-x64.json \
            --ledger build/ci-input-ledgers/indexer-linux-x64.json \
            --git-sha "$GITHUB_SHA" \
            --require-kind ci-rust-cli-linux-x64 \
            --require-kind ci-indexer-linux-x64 \
            --artifact "ci-rust-cli-linux-x64=${cli_asset}" \
            --artifact "ci-indexer-linux-x64=${indexer_asset}"
          packager_dir="$RUNNER_TEMP/kast-ci-packager"
          rm -rf "$packager_dir" dist
          mkdir -p "$packager_dir" dist/ci-ledgers
          scripts/extract-safe-zip.py "$cli_asset" "$packager_dir"
          chmod 755 "$packager_dir/kastctl"
          "$packager_dir/kastctl" developer release package setup-bundle \
            --repo-root "$PWD" \
            --cli-archive "$cli_asset" \
            --indexer-archive "$indexer_asset" \
            --platform linux-x64 \
            --version "$setup_manifest_version" \
            --bundle-output "$setup_asset"
          scripts/verify-ci-artifact-ledger.py record \
            --output dist/ci-ledgers/setup-linux-x64.json \
            --git-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-kind ci-setup-linux-x64 \
            --artifact-name kast-setup-linux-x64 \
            --artifact-path "$setup_asset" \
            --producer-job source-bound-linux-setup \
            --build-command-id ci-package-linux-setup
          (cd dist && sha256sum -c "$(basename -- "$setup_asset").sha256")

      - name: Upload canonical Linux setup bundle
        uses: actions/upload-artifact@v6
        with:
          name: kast-setup-linux-x64
          path: |
            dist/kast-linux-x64-v0.0.0-ci.tar.gz
            dist/kast-linux-x64-v0.0.0-ci.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload canonical Linux setup ledger
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifact-ledger-setup-linux-x64
          path: dist/ci-ledgers/setup-linux-x64.json
          if-no-files-found: error
          retention-days: 3

  install-linux-setup:
    name: Linux setup activation
    runs-on: ubuntu-24.04
    needs: source-bound-linux-setup
    steps:
      - uses: actions/checkout@v5

      - name: Download canonical Linux setup bundle
        uses: actions/download-artifact@v7
        with:
          name: kast-setup-linux-x64
          path: dist

      - name: Download canonical Linux setup ledger
        uses: actions/download-artifact@v7
        with:
          name: ci-artifact-ledger-setup-linux-x64
          path: ci-ledgers

      - name: Verify canonical Linux setup bundle
        shell: bash
        run: |
          set -euo pipefail
          setup_asset="dist/kast-linux-x64-v0.0.0-ci.tar.gz"
          scripts/verify-ci-artifact-ledger.py verify \
            --ledger ci-ledgers/setup-linux-x64.json \
            --git-sha "$GITHUB_SHA" \
            --require-kind ci-setup-linux-x64 \
            --artifact "ci-setup-linux-x64=${setup_asset}"
          ./scripts/verify-setup-bundle.sh "$setup_asset"

  indexer-performance:
    name: Indexer performance baselines
    runs-on: ubuntu-latest
    needs: workflow-contracts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Free disk for indexer performance baselines
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Run indexer performance baselines
        run: ./scripts/ci-gradle-retry.sh ./gradlew :indexer:test -PincludeTags=performance
