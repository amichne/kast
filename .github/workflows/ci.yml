name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify installer recovery flow
        run: bash packaging/test-installer.sh

  kotlin:
    name: Kotlin product
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Kotlin product and runtime delivery
        run: >-
          ./gradlew
          -Dorg.gradle.jvmargs=-Xmx5g
          build
          installedProductTest
          verifyKastArchitecture

      - name: Verify release asset contract
        run: |
          bash .github/scripts/release/test-admit-source.sh
          bash .github/scripts/release/test-module-knowledge-authority.sh
          python3 distribution/release/test_verify_assets_authority.py
          python3 distribution/release/verify_assets.py --self-test
