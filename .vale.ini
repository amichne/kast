# Rules and licenses are checked in. Use Vale 3.24.0 from mise.toml.
StylesPath = config/vale/styles
MinAlertLevel = suggestion
Vocab = Slopsentral, Kast
IgnoredScopes = code, tt, kbd, frontmatter

[*.{md,mdx,txt}]
BasedOnStyles = Vale, Slopsentral
Slopsentral.ProcedureLength = NO
Slopsentral.CommitWrap = NO

# The glossary governs current authored documentation and agent instructions.
[README.md]
BasedOnStyles = Vale, Slopsentral, Kast

[AGENTS.md]
BasedOnStyles = Vale, Slopsentral, Kast

[docs/*.md]
BasedOnStyles = Vale, Slopsentral, Kast

[**/AGENTS.md]
BasedOnStyles = Vale, Slopsentral, Kast

[docs/public/**/*.mdx]
BasedOnStyles = Vale, Slopsentral, Kast

[docs/public/tutorials/**.{md,mdx}]
BasedOnStyles = Vale, Slopsentral, Kast, Tutorial
Slopsentral.ProcedureLength = YES

[docs/public/how-to/**.{md,mdx}]
BasedOnStyles = Vale, Slopsentral, Kast, HowTo
Slopsentral.ProcedureLength = YES

[docs/public/reference/**.{md,mdx}]
BasedOnStyles = Vale, Slopsentral, Kast, Reference

[docs/public/explanation/**.{md,mdx}]
BasedOnStyles = Vale, Slopsentral, Kast, Explanation

# Established routes keep their URLs and use their reader-purpose rules.
[docs/public/{start,agent-harnesses,troubleshooting}.mdx]
BasedOnStyles = Vale, Slopsentral, Kast, HowTo
Slopsentral.ProcedureLength = YES

[docs/public/reference/{search,query-pipelines,change,integrations,installation,troubleshooting,management}.mdx]
BasedOnStyles = Vale, Slopsentral, Kast, HowTo
Slopsentral.ProcedureLength = YES

[docs/public/reference/{evidence-boundaries,callbacks}.mdx]
BasedOnStyles = Vale, Slopsentral, Kast, Explanation

[docs/public/reference/internals/*.mdx]
BasedOnStyles = Vale, Slopsentral, Kast, Explanation

# These files describe historical wording or the vocabulary itself.
[docs/reviews/**]
Kast.Terminology = NO

[docs/GLOSSARY.md]
Kast.Terminology = NO

[COMMIT_EDITMSG]
BasedOnStyles = Commits, Conventional, Slopsentral
View = Commit
Slopsentral.CommitWrap = YES
