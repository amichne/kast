name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "README.md"
      - "docs/**"
      - "requirements-docs.txt"
      - "zensical.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "README.md"
      - "docs/**"
      - "requirements-docs.txt"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build public site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/tooling/likec4/package-lock.json

      - name: Install documentation dependencies
        run: python3 -m pip install --requirement requirements-docs.txt

      - name: Check public documentation
        run: python3 docs/test_public_docs.py

      - name: Build public site
        run: python3 docs/build_public_site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy public site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
